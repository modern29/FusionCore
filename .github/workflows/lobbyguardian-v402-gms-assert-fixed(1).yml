                var file=FileAt("LobbyGuardian-advanced-settings.json");
                if(!File.Exists(file))return true;
                using var doc=JsonDocument.Parse(File.ReadAllText(file));
                return !doc.RootElement.TryGetProperty("LocalCosmeticUnlock",out var value)
                    || value.ValueKind!=JsonValueKind.False;
            } catch {return true;}
                  }
              }
