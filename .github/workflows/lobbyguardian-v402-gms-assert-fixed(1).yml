# v4.0.2: GMS diagnostic step now accepts 4.0 runtime version after all host protection changes.
# v4.0.1: Fix CS0136 shadowing in optional RPC receive hook; preserve 4.0 runtime, Free Chat, and all UI feature patches.
# v4.0: opt-in host rejoin-flood defense, single target vote, host-side vote-kick filter. Server may override.
# v3.9: Host-only RPC activity monitoring, opt-in auto-ban for repeated abnormal RPC floods or custom mod RPCs, genuine host destroy request. RPC signatures can be spoofed. Remote ejection animation not guaranteed.
# v3.8: Opt-in non-host whisper relay for registered +25 LG-hosted rooms; host-only request to close own room; no anti-cheat evasion.
# v3.7: local clone rendering fallback, readable Find Game host text, full dark chat input/panel, paced manual rejoin. No anti-cheat evasion.
# v3.6: optional platform/level requests, local-only sprite clones, dark chat, randomized name on rejoin and styled chat.
# v3.5: native Find Game list auto refresh 2.5s (in-flight/backoff) and local-only cosmetics availability with explicit diagnostics.
# v3.4.1: Resolve Google Play Services manifest metadata conflict before compilation.
# v3.4: Diagnostic-only Google Mobile Services / Play Games v2 availability, registration and safe error reporting.
# v3.3: One-use same-process Android sign-in handoff avoids unsupported IL2CPP JNI argument reflection.
# v3.2: Previous experimental JNI handoff superseded by v3.3.
# v3.1 fixed: avoid nonexistent Initialize call; preserve per-frame GoogleMergeLogin.Tick and apply token bridge patch.
# v3.0: repair Google Merge URL parser to handle real store=google&token=opaque credentials; verify via official eos-auth; show truthful game login status.
# v2.9: real decor-drawn panel with touch drag/resize; individual saved host moderation lists and lobby player selection.
# Lobby Guardian 2.8: full host name + platform, draggable/resizable MMC-style sidebar, clipboard sign-in preserved.
# v2.7.1: clipboard one-tap sign-in; prevents long merge URL from obscuring dialog controls.
# v2.7: real local Toolbox functions and browser Share -> one-time official sign-in bridge.
# v2.5: experimental targeted host whispers, petting-hand animation and locally scoped penalty option; retained v2.4 changes.
# Lobby Guardian Android candidate builder
# This file builds original open-source FusionCore plus an independent experimental plugin.
# It does not change your installed Among Us APK or use account tokens.
# Embedded source archive SHA-256: 0a9e4c4b0f7807c7cee91f064400a6957778550fe9c08c538364d1d1ef868fd9
