      - name: Fix duplicate Google Play Services version manifest metadata (v3.4.1)
        shell: bash
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          import re
          manifest = Path('fusionApp/src/main/AndroidManifest.xml')
          xml = manifest.read_text(encoding='utf-8')
          pattern = r'^[ \t]*<meta-data\s+android:name="com\.google\.android\.gms\.version"\s+android:value="12451000"\s*/>\s*\n'
          patched, count = re.subn(pattern, '', xml, count=1, flags=re.MULTILINE)
          if count != 1:
              raise SystemExit('Expected exactly one legacy hardcoded Google Play Services version metadata entry')
          manifest.write_text(patched, encoding='utf-8')
          print('Removed outdated hardcoded GMS version; Play Services SDK declares @integer/google_play_services_version')
          PYTHON
