      - name: Repair local clones, enlarge host labels, and pace rejoin (v3.7)
        shell: bash
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          import base64,zlib
          root=Path('LobbyGuardian/Plugin')
          target=root/'LobbyAppearance.cs'
          assert target.is_file() and 'TickClones' in target.read_text(), 'v3.6 appearance source missing'
          target.write_bytes(zlib.decompress(base64.b64decode('')))
          # Only enlarge client-rendered labels, not native matchmaking responses.
          extras=root/'ExtraFeatures.cs'
          s=extras.read_text()
          a='const string start="\\n<size=66%><color=#EDE7FF>";'
          assert s.count(a)==1, 'Expected v3.6 host row label not found'
          s=s.replace(a,'const string start="\\n<size=92%><color=#FFFFFF>";',1)
          a='"\\n<size=66%><color=#EDE7FF>"'
          assert s.count(a)==1, 'Expected old host row marker'
          s=s.replace(a,a+',"\\n<size=92%><color=#FFFFFF>"',1)
          a='"Host: "+host+"</color>   <color=#B89DFF>"+platform+"</color></size>"'
          assert s.count(a)==1, 'Expected platform line not found'
          s=s.replace(a,'"Host: "+host+"</color>  <color=#E3D1FF>"+platform+"</color></size>"',1)
          extras.write_text(s)
          # Manual rejoin waits for the previous connection to close before one join request.
          client=root/'ClientFeatures.cs'
          c=client.read_text()
          a='    private static bool _reconnectAttempted;'
          assert c.count(a)==1
          c=c.replace(a,a+'''\n    private static bool _manualRejoinPending;
              private static DateTimeOffset _manualRejoinAt = DateTimeOffset.MinValue;
              private static DateTimeOffset _manualRejoinExpires = DateTimeOffset.MinValue;''',1)
          a='        _lastExitRestricted = false;'
          assert c.count(a)==1
          c=c.replace(a,a+'\n        _manualRejoinPending = false;',1)
          a='        SaveRecentRoom("disconnected");'
          assert c.count(a)==1
          c=c.replace(a,'        if (_manualRejoinPending) _manualRejoinAt = DateTimeOffset.UtcNow.AddSeconds(3);\n'+a,1)
          a='            ProcessManualRejoin();'
          assert c.count(a)==1
          c=c.replace(a,a+'\n            PumpManualRejoin();',1)
          a='            TryRejoin(); // a single user-initiated attempt; server still controls entry'
          assert c.count(a)==1
          c=c.replace(a,'''            _manualRejoinPending = true;
                      _manualRejoinAt = DateTimeOffset.UtcNow.AddSeconds(2);
                      _manualRejoinExpires = DateTimeOffset.UtcNow.AddSeconds(20);
                      Status("rejoin-queued", "Waiting for the previous connection to close; one attempt only");''',1)
          a='    private static void ProcessHostCommand()'
          assert c.count(a)==1
          addition='''    private static void PumpManualRejoin()
              {
                  if (!_manualRejoinPending) return;
                  var now = DateTimeOffset.UtcNow;
                  if (_lastExitRestricted) { _manualRejoinPending=false; Status("rejoin-blocked","Server kick/ban rejected the recent room"); return; }
                  if (IsJoined()) { _manualRejoinPending=false; Status("rejoin-skipped","Already in a room"); return; }
                  if (now > _manualRejoinExpires) { _manualRejoinPending=false; Status("rejoin-expired","Recent room not ready; use Find Game"); return; }
                  if (now < _manualRejoinAt) return;
                  string state=Get(GameBridge.Client,"GameState")?.ToString()??"";
                  if (state.Contains("Joining",StringComparison.OrdinalIgnoreCase) ||
                      state.Contains("Connecting",StringComparison.OrdinalIgnoreCase)) return;
                  _manualRejoinPending=false;
                  TryRejoin();
              }
          
          '''
          c=c.replace(a,addition+a,1)
          client.write_text(c)
          status=root/'RuntimeStatus.cs'
          v=status.read_text()
          assert v.count('pluginVersion = "3.6"')==1, 'Expected v3.6 runtime version'
          status.write_text(v.replace('pluginVersion = "3.6"','pluginVersion = "3.7"',1))
          assert 'GoogleMergeLogin.Tick();' in client.read_text(), 'Free Chat code missing'
          print('v3.7 clone, readability, dark input and rejoin fixes installed')
          PYTHON
