      - name: Fix Android HOME and XDG cache before Harmony initializes
        shell: bash
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          path=Path('fusionApp/src/main/jni/fusion/src/fusion.cpp')
          source=path.read_text()
          anchor='        // set TMPDIR for MonoMod lib drops'
          assert source.count(anchor) == 1, 'FusionCore native bootstrap anchor changed'
          additional = chr(10).join([
              '        // Android MonoMod/Harmony cache must use an app-writable path.',
              '        // These variables are set before managed CoreCLR starts.',
              '        setenv("HOME", runtime_config.codeCacheDirectory.c_str(), 1);',
              '        setenv("XDG_CACHE_HOME", runtime_config.codeCacheDirectory.c_str(), 1);',
          ]) + chr(10)
          source=source.replace(anchor, additional+anchor)
          path.write_text(source)
          print('Configured HOME and XDG_CACHE_HOME before CoreCLR initialization')
          PYTHON
      - name: Fix duplicate Java local names in v2.3 menu
        shell: bash
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          p=Path('fusionApp/src/main/java/dev/allofus/fusioncore/LobbyGuardianOverlay.java')
          code=p.read_text()
          replacements={
              'String host=uri.getHost();': 'String signInHost=uri.getHost();',
              'host==null ||': 'signInHost==null ||',
              'host.equalsIgnoreCase("innersloth.com")||host.toLowerCase(java.util.Locale.ROOT).endsWith(".innersloth.com")': 'signInHost.equalsIgnoreCase("innersloth.com")||signInHost.toLowerCase(java.util.Locale.ROOT).endsWith(".innersloth.com")',
              'cosmetics.setOnCheckedChangeListener((b,enabled)->setAdvancedSetting(activity,"LocalCosmeticUnlock",enabled));': 'cosmetics.setOnCheckedChangeListener((b,checked)->setAdvancedSetting(activity,"LocalCosmeticUnlock",checked));'
          }
          for previous, fixed in replacements.items():
              found=code.count(previous)
              assert found==1, f'Expected one Java occurrence, found {found}: {previous}'
              code=code.replace(previous,fixed,1)
          p.write_text(code)
          print('Fixed v2.3 Java local variable name collisions')
          PYTHON
