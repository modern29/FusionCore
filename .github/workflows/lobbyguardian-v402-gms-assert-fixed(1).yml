      - name: Fix Java variable collisions after v2.4 overlay replacement
        shell: bash
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          p=Path('fusionApp/src/main/java/dev/allofus/fusioncore/LobbyGuardianOverlay.java')
          code=p.read_text()
          replacements = {
              'String host=uri.getHost();': 'String signInHost=uri.getHost();',
              'host==null ||': 'signInHost==null ||',
              'host.equalsIgnoreCase("innersloth.com")||host.toLowerCase(java.util.Locale.ROOT).endsWith(".innersloth.com")':
                  'signInHost.equalsIgnoreCase("innersloth.com")||signInHost.toLowerCase(java.util.Locale.ROOT).endsWith(".innersloth.com")',
              'cosmetics.setOnCheckedChangeListener((b,enabled)->setAdvancedSetting(activity,"LocalCosmeticUnlock",enabled));':
                  'cosmetics.setOnCheckedChangeListener((b,checked)->setAdvancedSetting(activity,"LocalCosmeticUnlock",checked));',
          }
          for original, fixed in replacements.items():
              count=code.count(original)
              assert count==1, f'Expected one match, found {count}: {original}'
              code=code.replace(original,fixed,1)
          p.write_text(code)
          print('Fixed duplicated host and enabled variables after later overlay replacement')
          PYTHON
      - name: Replace long Google Merge URL dialog with one-tap clipboard action
        shell: bash
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          p = Path('fusionApp/src/main/java/dev/allofus/fusioncore/SelectorActivity.java')
          s = p.read_text()
          start_anchor = '        android.widget.Button loginButton = new android.widget.Button(this);'
          end_anchor = '        android.widget.FrameLayout.LayoutParams loginButtonParams = new android.widget.FrameLayout.LayoutParams('
          assert s.count(start_anchor) == 1, 'Missing Google Merge sign-in launcher button'
          assert s.count(end_anchor) == 1, 'Missing launcher button layout params'
          a = s.index(start_anchor)
          b = s.index(end_anchor, a)
          s = s[:a] + __import__('base64').b64decode('').decode('utf-8') + s[b:]
          assert 'loginButton.setText("Paste & Use Link")' in s
          assert 'LobbyGuardianAuthBridge.setPendingUrl(value);' in s
          p.write_text(s)
          print('Installed one-tap Paste & Use Link button; full URL no longer appears in an input field')
          PYTHON
