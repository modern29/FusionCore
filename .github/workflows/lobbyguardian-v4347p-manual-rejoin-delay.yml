    - name: Compile and test host rule behavior
      shell: bash
      run: 'set -e

        T=$(mktemp -d)

        dotnet new console --framework net10.0 --output "$T" --no-restore

        cp LobbyGuardian/Plugin/ModerationRules.cs "$T/ModerationRules.cs"

        cat > "$T/Program.cs" <<''CS''

        using System;

        using LobbyGuardian;

        static void Check(bool ok,string label){if(!ok)throw new Exception(label);Console.WriteLine("PASS
        "+label);}

        var r=new RuleSettings();

        var p=new PlayerIdentity{ClientId=7,FriendCode="guest#1234",Puid="guest-id",Name="Guest"};

        r.AllowFriendCodes.Add("trusted#0000");

        Check(ModerationRules.OnJoin(r,p,true).Action==ModerationAction.Allow,"default
        off");

        r.KickEveryoneExceptWhitelist=true;

        Check(ModerationRules.OnJoin(r,p,true).Action==ModerationAction.Kick,"new
        kick rule");

        Check(ModerationRules.OnJoin(r,p,false).Action==ModerationAction.Allow,"host
        only");

        p.FriendCode="trusted#0000";Check(ModerationRules.OnJoin(r,p,true).Action==ModerationAction.Allow,"whitelist
        protected");

        p.FriendCode="guest#1234";

        r.AutoBanEnabled=true;r.BanFriendCodes.Add(p.FriendCode);

        Check(ModerationRules.OnJoin(r,p,true).Action==ModerationAction.Ban,"original
        explicit ban precedence");

        r.BanFriendCodes.Clear();

        Check(ModerationRules.OnJoin(r,p,true).Action==ModerationAction.Kick,"bulk
        kick independent of enabled explicit bans");

        r.BanEveryone=true;

        Check(ModerationRules.OnJoin(r,p,true).Action==ModerationAction.Ban,"original
        bulk ban precedence");

        r.BanEveryone=false;r.AutoBanEnabled=false;r.KickEveryoneExceptWhitelist=false;

        Check(ModerationRules.OnJoin(r,p,true).Action==ModerationAction.Allow,"new
        switch off");

        r.AutoKickEnabled=true;r.KickFriendCodes.Add(p.FriendCode);

        Check(ModerationRules.OnJoin(r,p,true).Action==ModerationAction.Kick,"original
        kick list unchanged");

        CS

        dotnet run --project "$T" --configuration Release

        '
    - name: Compile final plugin
      run: dotnet build LobbyGuardian/LobbyGuardian.Plugin.csproj --configuration
        Release --no-restore --no-incremental
    - name: Package compiled plugin
      shell: bash
      run: "python3 - <<'PY'\nfrom pathlib import Path\nimport zipfile,hashlib\nasset=Path('fusionApp/src/main/assets/BepInEx-arm64.zip')\n\
        dll=Path('LobbyGuardian/bin/Release/net10.0/LobbyGuardian.Plugin.dll').read_bytes()\n\
        for marker in (b'WhitelistOnlyKick',b'SweepWhitelistOnly',b'KickEveryoneExceptWhitelist'):\n\
        \    assert marker in dll,marker\nfor marker in ('LobbyGuardian-whitelist-kick-status.json',):\n\
        \    assert marker.encode('utf-16le') in dll,marker\nwith zipfile.ZipFile(asset)\
        \ as old, zipfile.ZipFile(asset.with_suffix('.new.zip'),'w',compression=zipfile.ZIP_DEFLATED)\
        \ as new:\n    for item in old.infolist():\n        if item.filename.rsplit('/',1)[-1].lower()=='lobbyguardian.plugin.dll':continue\n\
        \        new.writestr(item,old.read(item))\n    new.writestr('plugins/LobbyGuardian.Plugin.dll',dll)\n\
        asset.with_suffix('.new.zip').replace(asset)\nprint('Final plugin SHA256:',hashlib.sha256(dll).hexdigest())\n\
        PY"
    - name: Build Android APK
      run: 'chmod +x gradlew

        ./gradlew :fusionApp:assembleDebug --stacktrace'
    - name: Verify APK contains final runtime and menu
      shell: bash
      run: "python3 - <<'PY'\nfrom pathlib import Path\nimport io,zipfile,hashlib\n\
        assert hashlib.sha256(Path('LobbyGuardian/Plugin/ClientFeatures.cs').read_bytes()).hexdigest()=='150c83ac485cda232a3d62f5fd75d0a005b314048591295b59a6ec82d0bc7477'\n\
        assert hashlib.sha256(Path('LobbyGuardian/Plugin/LobbyRaidGuard.cs').read_bytes()).hexdigest()=='779b0ffb4d215cf73f24f4ccbe040a0f967c4806e35e8b70a137c1315dd04db1'\n\
        expected=Path('LobbyGuardian/bin/Release/net10.0/LobbyGuardian.Plugin.dll').read_bytes()\n\
        apks=list(Path('fusionApp/build/outputs/apk/debug').glob('*.apk'))\nassert\
        \ apks,'APK not built'\nfor apk in apks:\n    with zipfile.ZipFile(apk) as\
        \ a:\n        with zipfile.ZipFile(io.BytesIO(a.read('assets/BepInEx-arm64.zip')))\
        \ as z:\n            matches=[n for n in z.namelist() if n.rsplit('/',1)[-1].lower()=='lobbyguardian.plugin.dll']\n\
        \            assert matches==['plugins/LobbyGuardian.Plugin.dll'],matches\n\
        \            assert z.read(matches[0])==expected,'Stale DLL in APK'\n    \
        \    dex=b''.join(a.read(n) for n in a.namelist() if n.endswith('.dex'))\n\
        \        for marker in (b'KickEveryoneExceptWhitelist',b'Auto-kick everyone\
        \ except whitelist',b'VoteRejoinThree',b'LEAVE + REJOIN CURRENT ROOM',b'v4.3.47p',b'Standalone\
        \ rejoin delay',b'CANCEL PENDING MANUAL REJOIN',b'delaySeconds'):\n      \
        \      assert marker in dex,marker\n        for marker in (b'queueExplicitVoteRounds',b'RaidTargetVoteRepeat',b'VoteRejoinFour',b'Leave\
        \ and return?'):\n            assert marker not in dex,marker\n        assert\
        \ b'WhitelistKickStatus' in expected\n        assert b'ManualDelayStatus'\
        \ in expected\n        assert b'_cycleRoundLimit' not in expected\n    print(apk.name,\
        \ 'verified packaged DLL:',hashlib.sha256(expected).hexdigest())\nPY"
    - name: Upload packaging-verified candidate
      uses: actions/upload-artifact@v4
      with:
        name: LobbyGuardian-v4.3.47p-ManualRejoinDelay-Candidate
        path: fusionApp/build/outputs/apk/debug/*.apk
        if-no-files-found: error
    - name: Upload final sources
      uses: actions/upload-artifact@v4
      with:
        name: LobbyGuardian-v4.3.47p-Sources
        path: 'LobbyGuardian/Plugin/*.cs

          fusionApp/src/main/java/dev/allofus/fusioncore/LobbyGuardianOverlay.java

