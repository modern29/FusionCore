name: Lobby Guardian v4.3.40 - Advanced Hosted-Lobby Crash and Flood Defense
'on':
  push:
    paths:
    - .github/workflows/lobbyguardian-v4340-advanced-host-anti-crash-disconnect.yml
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
    - name: Checkout FusionCore
      uses: actions/checkout@v4
    - name: Java 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
    - name: .NET 10
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    - name: Gradle
      uses: gradle/actions/setup-gradle@v4
    - name: Install PyYAML
      run: python3 -m pip install --user PyYAML
    - name: Recreate v4.3.38 working source stages
      shell: bash
      run: "python3 - <<'PY_BASELINE\nfrom pathlib import Path\nimport subprocess,yaml\nsource=Path('.github/workflows/lobbyguardian-v4338-fix-ghost-chat-alwayschat-ghosts-vents-spoof.yml')\n\
        assert source.is_file(), 'Previous successful v4.3.38 workflow not found'\nold=yaml.safe_load(source.read_text(encoding='utf8'))\nsteps=old['jobs']['android']['steps']\n\
        assert sum(s.get('name')=='Build v4.3.38 Android candidate APK' for s in steps)==1\ncount=0\nfor step in steps:\n    name=step.get('name','')\n\
        \    if name=='Build v4.3.38 Android candidate APK':break\n    if not step.get('run') or name=='Install PyYAML':continue\n    print('>>>\
        \ BASELINE '+name,flush=True)\n    subprocess.run(['bash','-eo','pipefail','-c',step['run']],check=True)\n    count+=1\nassert count>=18,\
        \ 'Not enough source stages were reproduced'\nprint('Recreated v4.3.38 game and Android sources from the pinned successful workflow:',count,'stages')\n\
        PY_BASELINE\n"
    - name: Fix GameCode resolver, name-on-join and Android copy-on-exit
      shell: bash
      run: "python3 - <<'PY_PATCH\nfrom pathlib import Path\nimport zlib,base64,subprocess\ns=\"\"\
        \nfile=Path('/tmp/patch_guardian_4339.py')\nfile.write_bytes(zlib.decompress(base64.b64decode(s)))\nsubprocess.run(['python3',str(file)],check=True)\n\
        PY_PATCH\ndotnet build LobbyGuardian/LobbyGuardian.Plugin.csproj --configuration Release --no-restore\npython3 - <<'PY_DLL\nfrom pathlib\
        \ import Path\nimport os,zipfile\nasset=Path('fusionApp/src/main/assets/BepInEx-arm64.zip')\ndll=Path('LobbyGuardian/bin/Release/net10.0/LobbyGuardian.Plugin.dll')\n\
        assert asset.is_file() and dll.is_file(), 'Compiled plugin or bundled BepInEx runtime missing'\ntemp=asset.with_suffix('.code4339.zip')\n\
        with zipfile.ZipFile(asset) as old,zipfile.ZipFile(temp,'w') as fresh:\n    prefix=next((n[:-len('core/BepInEx.Core.dll')] for n in old.namelist()\
        \ if n.endswith('core/BepInEx.Core.dll')),None)\n    assert prefix is not None, 'BepInEx core missing'\n    target=prefix+'plugins/LobbyGuardian.Plugin.dll'\n\
        \    for entry in old.infolist():\n        if entry.filename!=target:fresh.writestr(entry,old.read(entry.filename))\n    fresh.write(dll,target,compress_type=zipfile.ZIP_DEFLATED)\n\
        os.replace(temp,asset)\nprint('Lobby Guardian 4.3.39 game/plugin and Android native clipboard bridge bundled')\nPY_DLL\n"
    - name: Add selective host-only anti-flood defense, disconnect incident recorder, original Guardian controls and local self-test
      shell: bash
      run: "python3 - <<'PY_REPAIR_4340'\nimport zlib,base64,pathlib,subprocess\nroot=pathlib.Path('/tmp/guardian4340')\nroot.mkdir(parents=True,exist_ok=True)\n\
        (root/'HostResilienceShield.cs').write_bytes(zlib.decompress(base64.b64decode(\"\"\
        )))\n(root/'patch.py').write_bytes(zlib.decompress(base64.b64decode(\"\"\
        )))\nsubprocess.run(['python3',str(root/'patch.py')],check=True)\nPY_REPAIR_4340\ndotnet build LobbyGuardian/LobbyGuardian.Plugin.csproj\
        \ --configuration Release --no-restore\npython3 - <<'PY_REBUNDLE_4340'\nimport zipfile,os\nfrom pathlib import Path\nasset=Path('fusionApp/src/main/assets/BepInEx-arm64.zip')\n\
        dll=Path('LobbyGuardian/bin/Release/net10.0/LobbyGuardian.Plugin.dll')\nassert asset.is_file() and dll.is_file(),'Patched host defense\
        \ DLL or runtime missing'\nwith zipfile.ZipFile(asset) as original:\n    prefix=next((x[:-len('core/BepInEx.Core.dll')] for x in original.namelist()\
        \ if x.endswith('core/BepInEx.Core.dll')),None)\n    assert prefix is not None,'BepInEx core missing'\n    name=prefix+'plugins/LobbyGuardian.Plugin.dll'\n\
        \    replacement=asset.with_name('guardian4340-bepinex.zip')\n    with zipfile.ZipFile(replacement,'w') as target:\n        for item in\
        \ original.infolist():\n            if item.filename!=name:target.writestr(item,original.read(item.filename))\n        target.write(dll,name,compress_type=zipfile.ZIP_DEFLATED)\n\
        \    assert replacement.stat().st_size>100000\n    os.replace(replacement,asset)\nprint('v4.3.40 host shield DLL has been rebuilt and\
        \ embedded in Android runtime')\nPY_REBUNDLE_4340\n"
    - name: Build v4.3.40 Android APK (with v4.3.39 fixes preserved)
      shell: bash
      run: 'python3 - <<''PY_BUILD

        from pathlib import Path

        import subprocess,yaml

        old=yaml.safe_load(Path(''.github/workflows/lobbyguardian-v4338-fix-ghost-chat-alwayschat-ghosts-vents-spoof.yml'').read_text(encoding=''utf8''))

        steps=old[''jobs''][''android''][''steps'']

        item=next(s for s in steps if s.get(''name'')==''Build v4.3.38 Android candidate APK'')

        assert item.get(''run''), ''Missing v4.3.38 APK packaging script''

        subprocess.run([''bash'',''-eo'',''pipefail'',''-c'',item[''run'']],check=True)

        print(''v4.3.39 Android APK assembly completed'')

        PY_BUILD

        '
    - name: Upload v4.3.40 APK
      uses: actions/upload-artifact@v4
      with:
        name: LobbyGuardian-v4.3.40-Android-Host-AntiCrash
        path: fusionApp/build/outputs/apk/debug/*.apk
        if-no-files-found: error
    - name: Upload v4.3.40 plugin and defense diagnostics
      uses: actions/upload-artifact@v4
      with:
        name: LobbyGuardian-v4.3.40-Sources-Diagnostics
        path: 'LobbyGuardian/Plugin/*.cs

          fusionApp/src/main/java/dev/allofus/fusioncore/GuardianUnifiedExtras.java

          LobbyGuardian/Plugin/HostResilienceShield.cs

          '
        if-no-files-found: error
