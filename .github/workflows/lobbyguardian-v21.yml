          assert hashlib.sha256(raw).hexdigest() == expected, 'Embedded source checksum mismatch'
          project = pathlib.Path('LobbyGuardian')
          project.mkdir(exist_ok=True)
          with zipfile.ZipFile(io.BytesIO(raw)) as z:
              for name in z.namelist():
                  out = (project / name).resolve()
                  assert out.is_relative_to(project.resolve()), 'Unexpected archive path'
                  out.parent.mkdir(parents=True, exist_ok=True)
                  out.write_bytes(z.read(name))
          src = pathlib.Path('fusionApp/src/main/assets/BepInEx-arm64.zip')
          refs = project / 'refs'
          refs.mkdir(exist_ok=True)
          with zipfile.ZipFile(src) as z:
              dlls = [name for name in z.namelist() if name.lower().endswith('.dll') and '/core/' in ('/' + name.lower())]
              print('FusionCore runtime DLLs found:', len(dlls))
              for name in dlls:
                  target = refs / pathlib.Path(name).name
                  target.write_bytes(z.read(name))
          required = ['BepInEx.Core.dll','BepInEx.Unity.IL2CPP.dll']
          missing = [name for name in required if not (refs/name).exists()]
          if missing:
              raise SystemExit(f'Missing FusionCore BepInEx assemblies: {missing}. Cannot build safely.')
          chosen = [p for p in sorted(refs.glob('*.dll')) if p.name.startswith((
              'BepInEx', 'Il2CppInterop', 'UnityEngine', 'Harmony', '0Harmony', 'MonoMod', 'Unhollower'
          ))]
          reference_xml = '\n'.join(
              '    <Reference Include="{}"><HintPath>refs/{}</HintPath><Private>false</Private></Reference>'.format(
              html.escape(p.stem, quote=True), html.escape(p.name, quote=True))
              for p in chosen
          )
          project_file = '''<Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <TargetFramework>net10.0</TargetFramework>
              <Nullable>enable</Nullable>
              <ImplicitUsings>enable</ImplicitUsings>
              <EnableDefaultCompileItems>false</EnableDefaultCompileItems>
              <AssemblyName>LobbyGuardian.Plugin</AssemblyName>
            </PropertyGroup>
            <ItemGroup>
              <Compile Include="Plugin/*.cs"/>
          __REFERENCES__
            </ItemGroup>
          </Project>'''.replace('__REFERENCES__',reference_xml)
          (project/'LobbyGuardian.Plugin.csproj').write_text(project_file)
          print('Selected compatible local references:', len(chosen))
          PYTHON
      - name: Add managed plugin status probe
        shell: bash
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          import base64,zlib
          out=Path('LobbyGuardian/Plugin/RuntimeStatus.cs')
          out.write_bytes(zlib.decompress(base64.b64decode('')))
          p=Path('LobbyGuardian/Plugin/LobbyGuardianPlugin.cs')
          s=p.read_text()
          old='RuleStore.LoadOrCreate(_rulesPath);'
          assert s.count(old)==1, 'Unexpected plugin Load structure'
          s=s.replace(old,old+'\n        RuntimeStatus.Update("plugin-loaded", "BepInEx entered LobbyGuardianPlugin.Load");')
          s=s.replace('_events.Write("system", "hook-attempted", "OnPlayerJoined registered");',
            '_events.Write("system", "hook-attempted", "OnPlayerJoined registered");\n            RuntimeStatus.Update("hook-attempted", "Join hook patch call returned; live events unverified");')
          s=s.replace('_events.Write("system", "hook-error", e.GetType().Name);',
            '_events.Write("system", "hook-error", e.GetType().Name);\n            RuntimeStatus.Update("hook-error", e.GetType().Name);')
          p.write_text(s)
          print('Plugin status probe added, source bytes',out.stat().st_size)
          PYTHON
