      - name: Fix Android HOME and XDG cache before Harmony initializes
        shell: bash
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          path=Path('fusionApp/src/main/jni/fusion/src/fusion.cpp')
          source=path.read_text()
          anchor='        // set TMPDIR for MonoMod lib drops'
          assert source.count(anchor) == 1, 'FusionCore native bootstrap anchor changed'
          additional = chr(10).join([
              '        // Android MonoMod/Harmony cache must use an app-writable path.',
              '        // These variables are set before managed CoreCLR starts.',
              '        setenv("HOME", runtime_config.codeCacheDirectory.c_str(), 1);',
              '        setenv("XDG_CACHE_HOME", runtime_config.codeCacheDirectory.c_str(), 1);',
          ]) + chr(10)
          source=source.replace(anchor, additional+anchor)
          path.write_text(source)
          print('Configured HOME and XDG_CACHE_HOME before CoreCLR initialization')
          PYTHON
      - name: Build custom Android FusionCore debug APK
        run: |
          chmod +x gradlew
          ./gradlew :fusionApp:assembleDebug --stacktrace
      - name: Upload experimental APK
        uses: actions/upload-artifact@v4
        with:
          name: LobbyGuardian-v2.1-Android-EXPERIMENTAL
          path: fusionApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Upload plugin source and DLL
        uses: actions/upload-artifact@v4
        with:
          name: LobbyGuardian-v2.1-Plugin-Diagnostics
          path: |
            LobbyGuardian/bin/Release/net10.0/LobbyGuardian.Plugin.dll
            LobbyGuardian/Plugin/*.cs
            LobbyGuardian/Docs/*.json
            LobbyGuardian/README.md
          if-no-files-found: warn
