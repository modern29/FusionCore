# Lobby Guardian Android candidate builder
# This file builds original open-source FusionCore plus an independent experimental plugin.
# It does not change your installed Among Us APK or use account tokens.
# Embedded source archive SHA-256: 0a9e4c4b0f7807c7cee91f064400a6957778550fe9c08c538364d1d1ef868fd9
name: Lobby Guardian Android v2.1 (host tools + player inspector)
on:
  push:
    paths:
      - '.github/workflows/lobbyguardian-v21.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
