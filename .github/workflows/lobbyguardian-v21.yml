      - name: Bundle plugin in FusionCore BepInEx asset
        shell: bash
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          import os, zipfile
          src = Path('fusionApp/src/main/assets/BepInEx-arm64.zip')
          compiled = Path('LobbyGuardian/bin/Release/net10.0/LobbyGuardian.Plugin.dll')
          if not compiled.is_file():
              raise SystemExit('Plugin DLL missing: build did not succeed')
          tmp = src.with_suffix('.new.zip')
          with zipfile.ZipFile(src) as source, zipfile.ZipFile(tmp,'w') as dest:
              name = next((n for n in source.namelist() if n.endswith('core/BepInEx.Core.dll')), None)
              if name is None:
                  raise SystemExit('Unexpected BepInEx archive layout')
              prefix = name[:-len('core/BepInEx.Core.dll')]
              target = prefix + 'plugins/LobbyGuardian.Plugin.dll'
              for info in source.infolist():
                  if info.filename != target:
                      dest.writestr(info, source.read(info.filename))
              dest.write(compiled, target, compress_type=zipfile.ZIP_DEFLATED)
          os.replace(tmp, src)
          print('Bundled plugin at', target, 'in', src)
          PYTHON
      - name: Add visible Android in-game controls and separate package identity
        shell: bash
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          import base64,zlib
          code=zlib.decompress(base64.b64decode(''))
          dest=Path('fusionApp/src/main/java/dev/allofus/fusioncore/LobbyGuardianOverlay.java')
          dest.write_bytes(code)
          game=Path('fusionApp/src/main/java/dev/allofus/fusioncore/hooks/GameRuntime.java')
          s=game.read_text()
          needle='            original.callActivityOnResume(activity);'
          assert s.count(needle)==1, 'Unexpected FusionCore activity lifecycle'
          replacement=needle+'\n            if (gameActivities.contains(activity)) {\n                try { dev.allofus.fusioncore.LobbyGuardianOverlay.attach(activity); }\n                catch (Throwable t) { Log.w("LobbyGuardianUI", "Overlay attach failed", t); }\n            }'
          s=s.replace(needle,replacement)
          game.write_text(s)
          build=Path('fusionApp/build.gradle.kts')
          g=build.read_text()
          old='applicationId = "dev.allofus.fusioncore"'
          assert g.count(old)==1, 'Unexpected Android applicationId'
          g=g.replace(old,'applicationId = "dev.lobbyguardian.fusioncore"')
          build.write_text(g)
          print('Overlay Java',len(code),'bytes; separate applicationId configured')
          PYTHON
      - name: Update in-game diagnostics display to v1.8
        shell: bash
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          p=Path('fusionApp/src/main/java/dev/allofus/fusioncore/LobbyGuardianOverlay.java')
          code=p.read_text()
          assert code.count('Lobby Guardian • v1.7') == 1
          code=code.replace('Lobby Guardian • v1.7', 'Lobby Guardian • v1.8')
          code=code.replace('LG_FLOATING_MENU_BUTTON_V17', 'LG_FLOATING_MENU_BUTTON_V18')
          code=code.replace('The LG button only proves the Android overlay is visible. Runtime status below shows whether the managed plugin loaded and whether its hook was attempted.',
              'Hook-registered means the native hook was requested. Hook-active means an actual join callback fired. Automatic bans are unverified until tested in a private room.')
          anchor='            line(activity, content, "Host moderation", '
          assert code.count(anchor)==1
          extra='''            Button copyStatus = new Button(activity);
            copyStatus.setText("Copy plugin diagnostics");
            copyStatus.setAllCaps(false);
            copyStatus.setOnClickListener(v -> {
                android.content.ClipboardManager clip = (android.content.ClipboardManager)
                    activity.getSystemService(android.content.Context.CLIPBOARD_SERVICE);
                if (clip != null) {
                    clip.setPrimaryClip(android.content.ClipData.newPlainText("Lobby Guardian status", getStatus()));
                    Toast.makeText(activity, "Diagnostic status copied", Toast.LENGTH_SHORT).show();
                }
            });
            content.addView(copyStatus);
          '''
          code=code.replace(anchor,extra+anchor)
          p.write_text(code)
          code=p.read_text()
          assert code.count('Lobby Guardian • v1.8')==1
          p.write_text(code.replace('Lobby Guardian • v1.8', 'Lobby Guardian • v1.9'))
          print('Updated LG overlay to v1.9 and retained copy-diagnostics control')
          PYTHON
