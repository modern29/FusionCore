# v4.3.18: Fix failed v4.3.17 compile (UnityEngine.dll references are not present
# in the FusionCore build). Runtime IL2CPP reflection only for independent visual
# crewmate body sprite. No PlayerControl spawns, networking, or DM modifications.
# Gameplay clone appearance still needs verification on device.
name: Lobby Guardian v4.3.18 - Fix Unity References, Visual Crewmate Body, DM Preserved
'on':
  push:
    paths:
    - .github/workflows/lobbyguardian-v4318-reflection-body-compile-fix.yml
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
    - name: Checkout FusionCore
      uses: actions/checkout@v4
    - name: Java 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
    - name: .NET 10
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    - name: Gradle
      uses: gradle/actions/setup-gradle@v4
    - name: Install PyYAML
      run: python3 -m pip install --user PyYAML
    - name: Preserve DM and use compatible runtime reflection for visual clone bodies
      shell: bash
      run: "python3 - <<'PYTHON'\nimport base64, pathlib, subprocess, urllib.request, zlib\nimport yaml\nsha='6805109d676d2c021cc30aa635b4501fc147f6d3'\nurl=('https://raw.githubusercontent.com/modern29/FusionCore/' + sha +\n    '/.github/workflows/lobbyguardian-v428-optional-alert-assertion-fix.yml')\nwith urllib.request.urlopen(url,timeout=60) as response:\n    original=yaml.safe_load(response.read().decode('utf-8'))\nsteps=original['jobs']['build']['steps']\nassert sum(s.get('name')=='Build Lobby Guardian plugin candidate' for s in steps)==1\nassert sum(s.get('name')=='Build custom Android FusionCore debug APK' for s in steps)==1\npatches=[\n    zlib.decompress(base64.b64decode('')).decode('utf-8'),\n    zlib.decompress(base64.b64decode('')).decode('utf-8')\n]\npatched=False\ncount=0\nfor step in steps:\n    label=step.get('name','')\n    if label=='Build Lobby Guardian plugin candidate':\n        for idx,patch in enumerate(patches,1):\n            patch_path=pathlib.Path('/tmp/lg_patch_'+str(idx)+'.py')\n            patch_path.write_text(patch,encoding='utf-8')\n            subprocess.run(['python3',str(patch_path)],check=True)\n        # v4.3.4: Restore a helper mistakenly removed by v4.3.2's\n        # cosmetics-only block replacement. Unmodified helper from v4.2.8.\n        visual_path=pathlib.Path('LobbyGuardian/Plugin/LobbyAppearance.cs')\n        visual_source=visual_path.read_text(encoding='utf-8')\n        marker='    // Make a real-looking LOCAL visual duplicate of the cosmetics hierarchy.'\n        if visual_source.count(marker)!=1:\n            raise RuntimeError('v4.3.4: expected visual clone insertion point missing')\n        if 'private static IEnumerable<object> ComponentsAll(' in visual_source:\n            raise RuntimeError('v4.3.4: ComponentsAll already defined; verify source baseline')\n        original_helper='    private static IEnumerable<object> ComponentsAll(object gameObject,Type t)\\n    {\\n        var results=new List<object>();\\n        foreach(var m in gameObject.GetType().GetMethods(F).Where(x=>x.Name==\"GetComponentsInChildren\")){\\n            try{\\n                MethodInfo call=m;\\n                object? result=null;\\n                if(m.IsGenericMethodDefinition&&m.GetGenericArguments().Length==1){\\n                    call=m.MakeGenericMethod(t);\\n                    if(m.GetParameters().Length==1)result=call.Invoke(gameObject,new object[]{true});\\n                    else if(m.GetParameters().Length==0)result=call.Invoke(gameObject,null);\\n                }else if(m.GetParameters().Length==2){\\n                    var a=m.GetParameters()[0].ParameterType==typeof(Type)?t:Il2CppTypeArg(m.GetParameters()[0].ParameterType,t);\\n                    if(a is not null)result=m.Invoke(gameObject,new object[]{a,true});\\n                }\\n                if(result is IEnumerable items&&result is not string){\\n                    foreach(var it in items)if(it is not null)results.Add(it);\\n                    if(results.Count>0)break;\\n                }\\n            }catch{}\\n        }\\n        return results;\\n    }\\n'\n        visual_source=visual_source.replace(marker,original_helper+'\\n'+marker,1)\n        visual_path.write_text(visual_source,encoding='utf-8')\n        assert visual_source.count('private static IEnumerable<object> ComponentsAll(')==1\n        print('v4.3.4: repaired missing ComponentsAll helper before C# compilation',flush=True)\n        # v4.3.5: add body sprites to visual twins and durable DM/role UI fixes.\n        patch435=zlib.decompress(base64.b64decode('')).decode('utf-8')\n        patch435path=pathlib.Path('/tmp/lg_patch_435.py')\n        patch435path.write_text(patch435,encoding='utf-8')\n        subprocess.run(['python3',str(patch435path)],check=True)\n        print('v4.3.5 visual twins, local DM feedback and role overlays patched',flush=True)\n        # v4.3.6 corrects two specific v4.3.5 runtime errors:\n        # missing cosmetics.currentBodySprite.BodySprite and /dm reading the\n        # empty container text before the real Android TextBoxTMP input.\n        patch436=zlib.decompress(base64.b64decode('')).decode('utf-8')\n        patch436path=pathlib.Path('/tmp/lg_patch_436.py')\n        patch436path.write_text(patch436,encoding='utf-8')\n        subprocess.run(['python3',str(patch436path)],check=True)\n        print('v4.3.6 fixed body sprite + fallback bean + private-chat Android input/roster',flush=True)\n        # v4.3.7: standalone renderer body art (no PlayerControl) and no-kick DM\n        patch437=zlib.decompress(base64.b64decode('')).decode('utf-8')\n        patch437path=pathlib.Path('/tmp/lg_patch_437.py')\n        patch437path.write_text(patch437,encoding='utf-8')\n        subprocess.run(['python3',str(patch437path)],check=True)\n        print('v4.3.7 clone body-art patch applied; unsafe targeted DM RPC disabled',flush=True)\n        # v4.3.8: original compatible whisper behavior, no proprietary code\n        patch438=zlib.decompress(base64.b64decode('')).decode('utf-8')\n        patch438path=pathlib.Path('/tmp/lg_patch_438.py')\n        patch438path.write_text(patch438,encoding='utf-8')\n        subprocess.run(['python3',str(patch438path)],check=True)\n        print('v4.3.8 recipient-targeted whisper with 100-char payload applied',flush=True)\n        # v4.3.9 original sprite-renderer composite, avoiding network fake player objects\n        patch439=zlib.decompress(base64.b64decode('')).decode('utf-8')\n        patch439path=pathlib.Path('/tmp/lg_patch_439.py')\n        patch439path.write_text(patch439,encoding='utf-8')\n        subprocess.run(['python3',str(patch439path)],check=True)\n        print('v4.3.9 full-layer sprite twins (body and outfit) applied',flush=True)\n        # 4.3.10 - runtime-matched local chat bubble and opt-in host-only player prefabs\n        patch4310=zlib.decompress(base64.b64decode('')).decode('utf-8')\n        patch4310path=pathlib.Path('/tmp/lg_patch_4310.py')\n        patch4310path.write_text(patch4310,encoding='utf-8')\n        subprocess.run(['python3',str(patch4310path)],check=True)\n        print('v4.3.10 chat echo + capped host dummy spawn patch applied',flush=True)\n        patch4311=zlib.decompress(base64.b64decode('')).decode('utf-8')\n        patch4311path=pathlib.Path('/tmp/lg_patch_4311.py')\n        patch4311path.write_text(patch4311,encoding='utf-8')\n        subprocess.run(['python3',str(patch4311path)],check=True)\n        print('v4.3.11 fixed chat bubbles / Android input / seat dummies',flush=True)\n        src4312=zlib.decompress(base64.b64decode('')).decode('utf-8')\n        patch4312=zlib.decompress(base64.b64decode('')).decode('utf-8')\n        srcpath=pathlib.Path('/tmp/lg_clone_v4312.cs')\n        srcpath.write_text(src4312,encoding='utf-8')\n        patchpath=pathlib.Path('/tmp/lg_patch_v4312.py')\n        patchpath.write_text(patch4312,encoding='utf-8')\n        subprocess.run(['python3',str(patchpath)],check=True)\n        print('v4.3.12: full rendered-player chair duplicates; working v4.3.11 DM untouched',flush=True)\n        # v4.3.13 replaces only the clone source after v4.3.12 is restored.\n        upgraded=zlib.decompress(base64.b64decode('')).decode('utf-8')\n        replace_target=pathlib.Path('LobbyGuardian/Plugin/HostNetClones.cs')\n        assert replace_target.is_file() and 'PlayerControl gameObject/transform unavailable' in replace_target.read_text()\n        replace_target.write_text(upgraded,encoding='utf-8')\n        print('v4.3.13: Unity inherited getter fallback, safe retries, DM UNCHANGED',flush=True)\n\n        visual=zlib.decompress(base64.b64decode('')).decode('utf-8')\n        inert=zlib.decompress(base64.b64decode('')).decode('utf-8')\n        appearance=pathlib.Path('LobbyGuardian/Plugin/LobbyAppearance.cs')\n        network_clone=pathlib.Path('LobbyGuardian/Plugin/HostNetClones.cs')\n        assert appearance.is_file() and network_clone.is_file()\n        assert 'HostNetClones.Tick();' in appearance.read_text(), 'Unexpected base clone invocation; refusing unsafe merge'\n        assert 'private static void TickClones()' in appearance.read_text(), 'Visual-only implementation missing'\n        appearance.write_text(visual,encoding='utf-8')\n        network_clone.write_text(inert,encoding='utf-8')\n        assert 'HostNetClones.Tick();' not in appearance.read_text()\n        assert 'Object.Instantiate' not in inert and 'PlayerControl' not in inert.split('internal static class HostNetClones')[1]\n        print('v4.3.14: enabled local SpriteRenderer clones; disabled all PlayerControl/NetId dummy spawning; DM unchanged',flush=True)\n        restored=pathlib.Path('LobbyGuardian/Plugin/LobbyAppearance.cs')\n        assert restored.is_file()\n        restored.write_text(zlib.decompress(base64.b64decode('')).decode('utf-8'),encoding='utf-8')\n\
        \        # v4.3.16: fix C# CS0136: nested bodyAt variable shadows outer bodyAt.\n        code=restored.read_text()\n        declaration='                var bodyAt=Vec(cx+(float)x+dx,cy+(float)y+dy,cz+0.03f+dz);'\n        reference='                if(bodyAt is not null)Set(Get(c.bodyGo,\"transform\"),\"position\",bodyAt);'\n        assert code.count(declaration)==1, 'Expected duplicate bodyAt declaration not found'\n        assert code.count(reference)==1, 'Expected bodyAt use not found'\n        code=code.replace(declaration,declaration.replace('var bodyAt=', 'var bodyPosition='),1)\n        code=code.replace(reference,reference.replace('bodyAt','bodyPosition'),1)\n        restored.write_text(code,encoding='utf-8')\n        print('v4.3.16: fixed CS0136 duplicate bodyAt variable',flush=True)\n        assert 'DuplicateCosmeticsOnly(p,i)' in restored.read_text()\n        # v4.3.17: native Unity graphics bean body; missing-source offset fix.\n        import hashlib\n        candidate=zlib.decompress(base64.b64decode(''))\n        assert hashlib.sha256(candidate).hexdigest()=='0454511f15dec9f35f039dd4eac3dca7ac7cc4a1b399a4f77a9aa93f5a013fd5'\n        old=restored.read_text(encoding='utf-8')\n        assert 'DuplicateCosmeticsOnly(p,i)' in old\n        assert 'var bodyPosition=Vec(cx+' in old\n        restored.write_bytes(candidate)\n        print('v4.3.17: body fallback and world offset fixed; DM untouched',flush=True)\n        # v4.3.18: UnityEngine generated IL2CPP managed references are not\n        # shipped in the FusionCore build environment. Remove typed Unity\n        # references while retaining the world-offset correction and fallback.\n        updated=zlib.decompress(base64.b64decode(''))\n        assert hashlib.sha256(updated).hexdigest()=='bcd2e21bc23a1b2898cf85f578f83f40f2b68f3570c87e9e911a1164565d155a'\n        restored.write_bytes(updated)\n        assert b'UnityEngine.GameObject?' not in restored.read_bytes()\n        print('v4.3.18: IL2CPP runtime-reflected bean body; no Unity managed compile refs, DM untouched',flush=True)\n        assert 'HostNetClones.Tick();' not in restored.read_text()\n        print('v4.3.15: restoring existing cosmetics-copy visual twins; no network spawning; working DM unchanged',flush=True)\n        patched=True\n    if label=='Build custom Android FusionCore debug APK':\n        break\n    cmd=step.get('run')\n    if cmd is None:continue\n    print('::group::v4.2.8 inherited: '+label,flush=True)\n    subprocess.run(['bash','-e','-o','pipefail','-c',cmd],check=True)\n    print('::endgroup::',flush=True)\n    count+=1\nif not patched or count<35:raise RuntimeError('Original source feature steps incomplete: '+str(count))\nprint('All existing features preserved, v4.3.2 and v4.3.3 patches applied',flush=True)\nPYTHON"
    - name: Build Android APK
      run: 'chmod +x gradlew

        ./gradlew :fusionApp:assembleDebug --stacktrace'
    - name: Upload Android APK
      uses: actions/upload-artifact@v4
      with:
        name: LobbyGuardian-v4.3.18-Android-ReflectionBodies
        path: fusionApp/build/outputs/apk/debug/*.apk
        if-no-files-found: error
    - name: Upload plugin source and diagnostics
      uses: actions/upload-artifact@v4
      with:
        name: LobbyGuardian-v4.3.18-Sources-Diagnostics
        path: 'LobbyGuardian/Plugin/*.cs

          LobbyGuardian/bin/Release/net10.0/LobbyGuardian.Plugin.dll'
        if-no-files-found: error
