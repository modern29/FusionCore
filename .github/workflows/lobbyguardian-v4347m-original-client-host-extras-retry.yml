      run: "python3 - <<'PY'\nfrom pathlib import Path\nimport io,zipfile,hashlib\nassert hashlib.sha256(Path('LobbyGuardian/Plugin/ClientFeatures.cs').read_bytes()).hexdigest()=='31d70980a901b636d85e6d2ba1abeae4f32c7a7045d974fa542ac9bb5713cc70'\n\
        assert hashlib.sha256(Path('LobbyGuardian/Plugin/LobbyRaidGuard.cs').read_bytes()).hexdigest()=='779b0ffb4d215cf73f24f4ccbe040a0f967c4806e35e8b70a137c1315dd04db1'\n\
        expected=Path('LobbyGuardian/bin/Release/net10.0/LobbyGuardian.Plugin.dll').read_bytes()\napks=list(Path('fusionApp/build/outputs/apk/debug').glob('*.apk'))\n\
        assert apks,'APK not built'\nfor apk in apks:\n    with zipfile.ZipFile(apk) as a:\n        with zipfile.ZipFile(io.BytesIO(a.read('assets/BepInEx-arm64.zip')))\
        \ as z:\n            matches=[n for n in z.namelist() if n.rsplit('/',1)[-1].lower()=='lobbyguardian.plugin.dll']\n\
        \            assert matches==['plugins/LobbyGuardian.Plugin.dll'],matches\n            assert z.read(matches[0])==expected,'Stale\
        \ DLL in APK'\n        dex=b''.join(a.read(n) for n in a.namelist() if n.endswith('.dex'))\n        for\
        \ marker in (b'KickEveryoneExceptWhitelist',b'View auto-kick status',b'Auto-kick everyone except whitelist',b'VoteRejoinThree',b'LEAVE\
        \ + REJOIN CURRENT ROOM',b'v4.3.47m'):\n            assert marker in dex,marker\n        for marker in (b'queueExplicitVoteRounds',b'RaidTargetVoteRepeat',b'VoteRejoinFour',b'Leave\
        \ and return?'):\n            assert marker not in dex,marker\n        assert b'FormatModerationNotice'\
        \ in expected and b'WhitelistKickStatus' in expected\n        assert b'_cycleRoundLimit' not in expected\n\
        \    print(apk.name, 'verified packaged DLL:',hashlib.sha256(expected).hexdigest())\nPY"
