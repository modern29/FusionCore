        steps=yaml.safe_load(old.read_text())['jobs']['android']['steps']\nfor step in steps:\n    name=step.get('name','')\n\
        \    if name=='Build v4.3.47 Android APK': break\n    if not step.get('run') or name=='Install PyYAML':\
        \ continue\n    print('>>> '+name,flush=True)\n    with tempfile.NamedTemporaryFile(mode='w',encoding='utf8',suffix='.sh',delete=False)\
        \ as f:\n        f.write(step['run']); script=f.name\n    try: subprocess.run(['bash','-eo','pipefail',script],check=True)\n\
