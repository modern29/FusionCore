        \    subprocess.run(['bash','-e','-o','pipefail','-c',cmd],check=True)\n    print('::endgroup::',flush=True)\n    count+=1\nif not\
        \ patched or count<35:raise RuntimeError('Original source feature steps incomplete: '+str(count))\nprint('All existing features\
