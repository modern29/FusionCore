        assert asset.is_file() and dll.is_file(), 'Missing new plugin assembly or Android archive'\ntmp=asset.with_suffix('.botshield.zip')\n\
        with zipfile.ZipFile(asset) as source, zipfile.ZipFile(tmp,'w') as dest:\n    core=next((n for n in source.namelist() if n.endswith('core/BepInEx.Core.dll')),None)\n\
        \    assert core, 'Missing BepInEx runtime'\n    target=core[:-len('core/BepInEx.Core.dll')]+'plugins/LobbyGuardian.Plugin.dll'\n\
        \    for info in source.infolist():\n        if info.filename != target: dest.writestr(info,source.read(info.filename))\n    dest.write(dll,target,compress_type=zipfile.ZIP_DEFLATED)\n\
