name: Lobby Guardian v4.3.37b - Fix Original Menu Anchor Integration
'on':
  push:
    paths:
    - .github/workflows/lobbyguardian-v4337b-main-menu-anchor-fix.yml
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
    - name: Checkout FusionCore
      uses: actions/checkout@v4
    - name: Java 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
    - name: .NET 10
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    - name: Gradle
      uses: gradle/actions/setup-gradle@v4
    - name: Install PyYAML
      run: python3 -m pip install --user PyYAML
    - name: Build consolidated Utility+ panel, host tools, role/ghost display, copy on leave; preserve DM and noclip
      shell: bash
      run: "python3 - <<'PYTHON'\nimport base64, pathlib, subprocess, urllib.request, zlib\nimport yaml\nsha='6805109d676d2c021cc30aa635b4501fc147f6d3'\n\
        url=('https://raw.githubusercontent.com/modern29/FusionCore/' + sha +\n    '/.github/workflows/lobbyguardian-v428-optional-alert-assertion-fix.yml')\n\
        with urllib.request.urlopen(url,timeout=60) as response:\n    original=yaml.safe_load(response.read().decode('utf-8'))\nsteps=original['jobs']['build']['steps']\n\
        assert sum(s.get('name')=='Build Lobby Guardian plugin candidate' for s in steps)==1\nassert sum(s.get('name')=='Build custom Android\
        \ FusionCore debug APK' for s in steps)==1\npatches=[\n    zlib.decompress(base64.b64decode('')).decode('utf-8'),\n\
        \    zlib.decompress(base64.b64decode('')).decode('utf-8')\n\
        ]\npatched=False\ncount=0\nfor step in steps:\n    label=step.get('name','')\n    if label=='Build Lobby Guardian plugin candidate':\n\
        \        for idx,patch in enumerate(patches,1):\n            patch_path=pathlib.Path('/tmp/lg_patch_'+str(idx)+'.py')\n        \
        \    patch_path.write_text(patch,encoding='utf-8')\n            subprocess.run(['python3',str(patch_path)],check=True)\n       \
        \ # v4.3.4: Restore a helper mistakenly removed by v4.3.2's\n        # cosmetics-only block replacement. Unmodified helper from\
        \ v4.2.8.\n        visual_path=pathlib.Path('LobbyGuardian/Plugin/LobbyAppearance.cs')\n        visual_source=visual_path.read_text(encoding='utf-8')\n\
        \        marker='    // Make a real-looking LOCAL visual duplicate of the cosmetics hierarchy.'\n        if visual_source.count(marker)!=1:\n\
        \            raise RuntimeError('v4.3.4: expected visual clone insertion point missing')\n        if 'private static IEnumerable<object>\
        \ ComponentsAll(' in visual_source:\n            raise RuntimeError('v4.3.4: ComponentsAll already defined; verify source baseline')\n\
        \        original_helper='    private static IEnumerable<object> ComponentsAll(object gameObject,Type t)\\n    {\\n        var results=new\
        \ List<object>();\\n        foreach(var m in gameObject.GetType().GetMethods(F).Where(x=>x.Name==\"GetComponentsInChildren\")){\\\
        n            try{\\n                MethodInfo call=m;\\n                object? result=null;\\n                if(m.IsGenericMethodDefinition&&m.GetGenericArguments().Length==1){\\\
        n                    call=m.MakeGenericMethod(t);\\n                    if(m.GetParameters().Length==1)result=call.Invoke(gameObject,new\
        \ object[]{true});\\n                    else if(m.GetParameters().Length==0)result=call.Invoke(gameObject,null);\\n           \
        \     }else if(m.GetParameters().Length==2){\\n                    var a=m.GetParameters()[0].ParameterType==typeof(Type)?t:Il2CppTypeArg(m.GetParameters()[0].ParameterType,t);\\\
        n                    if(a is not null)result=m.Invoke(gameObject,new object[]{a,true});\\n                }\\n                if(result\
        \ is IEnumerable items&&result is not string){\\n                    foreach(var it in items)if(it is not null)results.Add(it);\\\
        n                    if(results.Count>0)break;\\n                }\\n            }catch{}\\n        }\\n        return results;\\\
