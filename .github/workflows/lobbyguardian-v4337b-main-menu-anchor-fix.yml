    - name: Add Spoof tab, lobby history, encounter lookup and vote audit; recompile and bundle
      shell: bash
      run: "python3 - <<'PY_STAGE_4321'\nfrom pathlib import Path\nimport base64,zlib,subprocess\nPath('/tmp/SessionExtras.cs').write_bytes(zlib.decompress(base64.b64decode('')))\n\
        Path('/tmp/VoteAudit.cs').write_bytes(zlib.decompress(base64.b64decode('')))\n\
        Path('/tmp/PanelExtras.java.txt').write_bytes(zlib.decompress(base64.b64decode('')))\n\
        Path('/tmp/apply4321.py').write_bytes(zlib.decompress(base64.b64decode('')))\n\
        subprocess.run(['python3','/tmp/apply4321.py'],check=True)\nPY_STAGE_4321\n# Recompile after v4.3.20 build and replace bundled DLL,\
        \ before Gradle packages the APK.\ndotnet build LobbyGuardian/LobbyGuardian.Plugin.csproj --configuration Release --no-restore\n\
        python3 - <<'PY_BUNDLE_4321'\nfrom pathlib import Path\nimport os,zipfile\nasset=Path('fusionApp/src/main/assets/BepInEx-arm64.zip')\n\
        dll=Path('LobbyGuardian/bin/Release/net10.0/LobbyGuardian.Plugin.dll')\nassert asset.is_file() and dll.is_file(), 'Core APK asset\
        \ or newly compiled plugin missing'\ntmp=asset.with_suffix('.updated.zip')\nwith zipfile.ZipFile(asset) as source, zipfile.ZipFile(tmp,'w')\
        \ as dest:\n    core=next((n for n in source.namelist() if n.endswith('core/BepInEx.Core.dll')),None)\n    assert core is not None,'Unexpected\
        \ BepInEx core path'\n    prefix=core[:-len('core/BepInEx.Core.dll')]\n    target=prefix+'plugins/LobbyGuardian.Plugin.dll'\n  \
        \  for info in source.infolist():\n        if info.filename != target:dest.writestr(info,source.read(info.filename))\n    dest.write(dll,target,compress_type=zipfile.ZIP_DEFLATED)\n\
        os.replace(tmp,asset)\nprint('Updated bundled LobbyGuardian plugin with v4.3.21 features')\nPY_BUNDLE_4321\n"
