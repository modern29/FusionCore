    - name: Expose saved recent player history in Android menu
      shell: bash
      run: |
        python3 - <<'PY_PLAYER_HISTORY'
        from pathlib import Path
        p=Path('fusionApp/src/main/java/dev/allofus/fusioncore/GuardianUnifiedExtras.java')
        s=p.read_text(encoding='utf-8')
        anchor='    public static void addHostResilience(Activity a,LinearLayout p){'
        assert s.count(anchor)==1
        helper=r'''    private static final String PLAYER_HISTORY="LobbyGuardian-recent-players.json";
            private static JSONArray savedPlayerHistory(Activity a){
                File files=a.getFilesDir(),parent=files.getParentFile(),external=a.getExternalFilesDir(null);
                File[] dirs=new File[]{config(a),new File(files,"BepInEx/config"),new File(files,"BepInEx/config/config"),
                    new File(parent,"BepInEx/config"),new File(parent,"files/BepInEx/config"),new File(files,"config"),
                    new File(files,"BepInEx"),new File(parent,"BepInEx"),external==null?files:new File(external,"BepInEx/config")};
                JSONArray best=null;long newest=-1;
                for(File dir:dirs){
                    File file=new File(dir,PLAYER_HISTORY);
                    if(!file.isFile()||file.lastModified()<newest)continue;
                    try{JSONArray parsed=new JSONArray(read(file));best=parsed;newest=file.lastModified();}catch(Exception ignored){}
                }
                return best;
            }
            private static boolean digitBeforeHash(String code){
                int hash=code.indexOf('#');
                if(hash<=0)return false;
                for(int i=0;i<hash;i++)if(code.charAt(i)>='0'&&code.charAt(i)<='9')return true;
                return false;
            }
            private static void copyPlayerHistory(Activity a,boolean numberedOnly){
                JSONArray saved=savedPlayerHistory(a);
                if(saved==null){alert(a,"Recent player history","No readable saved history yet. Join or host a lobby, allow the player list to update, and try again. No clipboard changes made.");return;}
                JSONArray result=new JSONArray();
                for(int i=0;i<saved.length();i++){
                    JSONObject e=saved.optJSONObject(i);if(e==null)continue;
                    if(numberedOnly&&!digitBeforeHash(e.optString("friendCode","")))continue;
                    try{
                        JSONObject item=new JSONObject();
                        for(String key:new String[]{"name","friendCode","puid","platform","lastSeenUtc"})item.put(key,e.optString(key,""));
                        result.put(item);
                    }catch(Exception ignored){}
                }
                int count=result.length();
                if(count==0){alert(a,"Recent player history",numberedOnly?"No saved Friend Codes contain digits before #.":"No saved player records yet.");return;}
                String payload=result.toString();
                new AlertDialog.Builder(a).setTitle(numberedOnly?"Copy numbered Friend Codes":"Copy recent player history")
                    .setMessage(count+" saved player record(s). Includes recorded names, Friend Codes, PUIDs, platforms and last-seen times. Missing identifiers stay blank. Digits alone do not establish bot activity. Review before reporting and share only with official support if necessary.")
                    .setPositiveButton("Copy to clipboard",(d,w)->Toast.makeText(a,copy(a,payload)?"Copied "+count+" player record(s)":"Clipboard unavailable",Toast.LENGTH_LONG).show())
                    .setNegativeButton("Cancel",null).show();
            }
        '''
        s=s.replace(anchor,helper+anchor,1)
        anchor2='        button(a,p,"Bot diagnostics & reports",()->showReadableBotDiagnostics(a,reviewReports,'
        assert s.count(anchor2)==1
        s=s.replace(anchor2,'        button(a,p,"Copy recent player history",()->copyPlayerHistory(a,false));\n        button(a,p,"Copy numbered Friend Code history",()->copyPlayerHistory(a,true));\n'+anchor2,1)
        p.write_text(s,encoding='utf-8')
        print('Recent player history clipboard actions installed')
        PY_PLAYER_HISTORY
    - name: Build v4.3.60 Android APK
      shell: bash
      run: |
        python3 - <<'PY_BUILD'
        from pathlib import Path
        import subprocess,yaml,tempfile
        old=yaml.safe_load(Path('.github/workflows/lobbyguardian-v4338-fix-ghost-chat-alwayschat-ghosts-vents-spoof.yml').read_text(encoding='utf8'))
        steps=old['jobs']['android']['steps']
        item=next(s for s in steps if s.get('name')=='Build v4.3.38 Android candidate APK')
        assert item.get('run'), 'Missing v4.3.38 APK packaging script'
        with tempfile.NamedTemporaryFile(mode='w',encoding='utf8',suffix='.sh',delete=False) as temp:
            temp.write(item['run'])
            script_file=temp.name
        try:
            subprocess.run(['bash','-eo','pipefail',script_file],check=True)
        finally:
            Path(script_file).unlink(missing_ok=True)
        print('v4.3.60 Android APK assembly completed')
        PY_BUILD
