name: Lobby Guardian v4.3.82 - FPS and Match Transition candidate
'on':
  push:
    paths:
    - .github/workflows/lobbyguardian-v4382-fps-match-transition.yml
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
    - name: Checkout FusionCore
      uses: actions/checkout@v4
    - name: Java 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
    - name: .NET 10
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    - name: Gradle
      uses: gradle/actions/setup-gradle@v4
    - name: Install PyYAML
      run: python3 -m pip install --user PyYAML
    - name: Recreate verified v4.3.81 source stages
      shell: bash
      run: |
        python3 - <<'PY_BASE_4382'
        from pathlib import Path
        import subprocess, tempfile, yaml
        source=Path('.github/workflows/lobbyguardian-v4381-frame-performance-retry.yml')
        steps=yaml.safe_load(source.read_text())['jobs']['android']['steps']
        assert len(steps)==38 and steps[32]['name']=='Reduce repeated reflection and background diagnostic overhead'
        assert steps[33]['name']=='Compile final patched plugin and verify embedded binary'
        for s in steps[5:33]:
            assert 'run' in s and ('$'+'{{') not in s['run']
            print('>>> '+s['name'],flush=True)
            with tempfile.NamedTemporaryFile(mode='w',encoding='utf8',suffix='.sh',delete=False) as f:
                f.write(s['run']);path=Path(f.name)
