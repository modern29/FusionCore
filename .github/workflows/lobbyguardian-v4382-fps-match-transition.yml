        for apk in apks:
            with zipfile.ZipFile(apk) as z:
                with zipfile.ZipFile(io.BytesIO(z.read('assets/BepInEx-arm64.zip'))) as inner:
                    matches=[n for n in inner.namelist() if n.endswith('plugins/LobbyGuardian.Plugin.dll')]
                    assert len(matches)==1, 'Missing or duplicate packaged plugin'
                    actual=inner.read(matches[0])
                    assert actual==expected, 'Stale plugin in final APK: refusing upload'
            print(apk.name, 'verified plugin SHA256:',hashlib.sha256(expected).hexdigest())
        PY_VERIFY_4377
