    - name: Compile final patched plugin and verify embedded binary
      shell: bash
      run: |
        dotnet build LobbyGuardian/LobbyGuardian.Plugin.csproj --configuration Release --no-restore --no-incremental
        python3 - <<'PY_REPACK_4377'
        from pathlib import Path
        import hashlib, os, zipfile
        asset=Path('fusionApp/src/main/assets/BepInEx-arm64.zip')
        dll=Path('LobbyGuardian/bin/Release/net10.0/LobbyGuardian.Plugin.dll')
        assert asset.is_file() and dll.is_file(), 'Final build input missing'
        blob=dll.read_bytes()
        assert 'LobbyGuardian-frame-health.json'.encode('utf-16le') in blob, 'FPS telemetry missing from compiled plugin'
        assert 'separated chat layout='.encode('utf-16le') in blob, 'Chat layout patch absent'
        assert 'ghost-contrast'.encode('utf-16le') in blob, 'Ghost contrast patch absent'
        # Detect the exact stale compiled code observed inside the v4.3.76 APK.
        assert 'Switch the lobby to Private'.encode('utf-16le') not in blob, 'Old private-room gate still compiled into plugin'
        assert 'Shared decorations stopped outside the original hosted pregame room'.encode('utf-16le') in blob, 'Final clone patch absent from compiled plugin'
        assert 'normal-host-start'.encode('utf-16le') in blob, 'Final host start patch absent from compiled plugin'
        replacement=asset.with_name('guardian4377-bepinex.zip')
        with zipfile.ZipFile(asset) as old, zipfile.ZipFile(replacement,'w') as new:
            prefix=next((n[:-len('core/BepInEx.Core.dll')] for n in old.namelist() if n.endswith('core/BepInEx.Core.dll')),None)
            assert prefix is not None, 'BepInEx core missing'
            target=prefix+'plugins/LobbyGuardian.Plugin.dll'
            for item in old.infolist():
                if item.filename!=target:new.writestr(item,old.read(item.filename))
            new.writestr(target,blob,compress_type=zipfile.ZIP_DEFLATED)
        os.replace(replacement,asset)
        with zipfile.ZipFile(asset) as z:
            assert z.namelist().count(target)==1 and z.read(target)==blob, 'Embedded plugin mismatch'
        print('Final plugin SHA256:', hashlib.sha256(blob).hexdigest())
        PY_REPACK_4377
    - name: Build v4.3.82 Android APK
      shell: bash
      run: |
        python3 - <<'PY_BUILD'
        from pathlib import Path
        import subprocess,yaml,tempfile
        old=yaml.safe_load(Path('.github/workflows/lobbyguardian-v4338-fix-ghost-chat-alwayschat-ghosts-vents-spoof.yml').read_text(encoding='utf8'))
        steps=old['jobs']['android']['steps']
        item=next(s for s in steps if s.get('name')=='Build v4.3.38 Android candidate APK')
        assert item.get('run'), 'Missing v4.3.38 APK packaging script'
        with tempfile.NamedTemporaryFile(mode='w',encoding='utf8',suffix='.sh',delete=False) as temp:
            temp.write(item['run'])
            script_file=temp.name
        try:
            subprocess.run(['bash','-eo','pipefail',script_file],check=True)
        finally:
            Path(script_file).unlink(missing_ok=True)
        print('v4.3.82 Android APK assembly completed')
        PY_BUILD
    - name: Verify final APK contains exact freshly built plugin
