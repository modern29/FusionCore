        \ new):\n    p=root/name\n    s=p.read_text(encoding='utf8')\n    assert s.count(old)==1, (name,old[:100],s.count(old))\n\
        \    p.write_text(s.replace(old,new,1),encoding='utf8')\n# Format the actual rule reason from the caller. Do not alter\
        \ moderation decisions.\nchange('HostExtras.cs', '''        string verb = type == \"ban\" ? \"Auto-ban\" : type ==\
        \ \"kick\" ? \"Auto-kick\" : type;\n        var name = Sanitize(player.Name);\n        // A dispatched request is\
        \ not a server acknowledgement.\n        var message = verb + (dispatched ? \" requested: \" : \" FAILED: \") + name;\n\
        \        if (message.Length > 115) message = message[..115];\n        Warn(message, dispatched ? type + \"-requested\"\
        \ : type + \"-failed\");''', '''        var message = FormatModerationNotice(type, player, reason, dispatched);\n\
        \        Warn(message, dispatched ? type + \"-requested\" : type + \"-failed\");\n    }\n\n    internal static string\
        \ FormatModerationNotice(string type, PlayerIdentity player, string reason, bool dispatched)\n    {\n        string\
        \ verb = type == \"ban\" ? \"BAN\" : type == \"kick\" ? \"KICK\" : Sanitize(type);\n        string name = Sanitize(player.Name);\n\
        \        if (name.Length == 0) name = \"Client \" + player.ClientId;\n        string detail = (reason ?? \"\").Replace('\\\
        \\n',' ').Replace('\\\\r',' ').Trim();\n        if (detail.Length == 0) detail = \"No reason supplied by detector\"\
        ;\n        if (detail.Length > 180) detail = detail[..177] + \"...\";\n        // A local dispatch is not a confirmed\
        \ server removal.\n        return verb + (dispatched ? \" sent: \" : \" FAILED: \") + name + \"\\\\nReason: \" + detail\n\
        \            + (dispatched ? \"\\\\nServer outcome unconfirmed\" : \"\");''')\n# Existing manual status watcher must\
        \ not replace the reason with a generic message.\nchange('ClientFeatures.cs','            Status(sent ? \"host-action-requested\"\
        \ : \"host-action-error\", action + \" requested for \" + player.Name);','            Status(sent ? \"host-action-requested\"\
        \ : \"host-action-error\", HostExtras.FormatModerationNotice(action, player, \"Manual host action\", sent));')\n#\
        \ Previously silent paths: add the alert only; retain original dispatch and rules.\nchange('BauStyleAntiCheat.cs','\
        \                    if(GameBridge.Ban(player)){','''                    bool moderationSent=GameBridge.Ban(player);\n\
        \                    HostExtras.ModerationNotice(\"ban\",player,\"Repeated high-confidence findings: 5+ impossible\
        \ actions in 2 categories\",moderationSent);\n                    if(moderationSent){''')\nchange('ConnectionBotGuard.cs','_last=a.Reason+\"\
        ; early host ban requested (server outcome unverified)\";return true;', '''_last=a.Reason+\"; early host ban requested\
        \ (server outcome unverified)\";HostExtras.ModerationNotice(\"ban\",players.Length==1?players[0]:new PlayerIdentity{ClientId=a.Id},a.Reason,true);return\
        \ true;''')\nchange('ScheduledHostActions.cs','            bool sent=GameBridge.Kick(target);','''            bool\
        \ sent=GameBridge.Kick(target);\n            HostExtras.ModerationNotice(\"kick\",target,\"Host-scheduled kick timer\
        \ elapsed\",sent);''')\nchange('TempbanHost.cs','                bool requested=GameBridge.Kick(player);','''    \
        \            bool requested=GameBridge.Kick(player);\n                HostExtras.ModerationNotice(\"kick\",player,\"\
        Active timed rejoin restriction\",requested);''')\nchange('TempbanHost.cs','        bool sent=GameBridge.Kick(target);','''\
        \        bool sent=GameBridge.Kick(target);\n        HostExtras.ModerationNotice(\"kick\",target,\"Host-selected timed\
        \ removal\",sent);''')\n# Keep chat command's existing feedback, but add its reason.\nchange('LobbyChatCommands.cs','\
        \                    Notice((ok?\"Host \"+head[1..]+\" requested for \":\"Could not \"+head[1..]+\" \")+target.Name);','\
        \                    Notice(HostExtras.FormatModerationNotice(head[1..],target,\"Manual host chat command\",ok));')\n\
        # Show enough lines for the actual reason on small screens, without changing alert duration.\np=Path('fusionApp/src/main/java/dev/allofus/fusioncore/LobbyGuardianOverlay.java')\n\
        s=p.read_text(encoding='utf8')\nassert s.count('notice.setMaxLines(4);')==1\ns=s.replace('notice.setMaxLines(4);','notice.setMaxLines(8);',1)\n\
        assert s.count('version.setText(\"v4.3.47e • DRAG\");')==1\ns=s.replace('version.setText(\"v4.3.47e • DRAG\");','version.setText(\"\
        v4.3.47f • DRAG\");',1)\np.write_text(s,encoding='utf8')\nprint('Reason-aware alert formatting applied; moderation\
        \ rule logic and voting controls unchanged')\n\nPY_ALERT_REASON"
    - name: Compile and test the actual moderation alert formatter
      shell: bash
      run: 'set -e

        T=$(mktemp -d)

        dotnet new console --framework net10.0 --output "$T" --no-restore

        cp LobbyGuardian/Plugin/HostExtras.cs "$T/HostExtras.cs"

        cp LobbyGuardian/Plugin/ModerationRules.cs "$T/ModerationRules.cs"

        cat > "$T/Stubs.cs" <<''CS''

        namespace BepInEx { public static class Paths { public static string ConfigPath => System.IO.Path.GetTempPath(); }
        }

        namespace LobbyGuardian { internal static class GameBridge { public static bool IsHost()=>true; } }

        CS

        cat > "$T/Program.cs" <<''CS''

        using LobbyGuardian;

        static void Check(bool ok,string name){if(!ok)throw new Exception(name);Console.WriteLine("PASS "+name);}

        var p=new PlayerIdentity{ClientId=7,Name="Player#3848"};

        var kick=HostExtras.FormatModerationNotice("kick",p,"Not on host whitelist",true);

        Check(kick.Contains("KICK sent: Player#3848") && kick.Contains("Reason: Not on host whitelist") && kick.Contains("Server
        outcome unconfirmed"),"kick reason and status");

        var ban=HostExtras.FormatModerationNotice("ban",p,"Friend Code blacklist",true);

        Check(ban.Contains("BAN sent: Player#3848") && ban.Contains("Reason: Friend Code blacklist"),"ban reason");

        var failed=HostExtras.FormatModerationNotice("kick",p,"Manual host action",false);

        Check(failed.Contains("FAILED") && failed.Contains("Reason: Manual host action") && !failed.Contains("sent:"),"failure
        not shown as sent");

        p.Name="";

        Check(HostExtras.FormatModerationNotice("ban",p,"",true).Contains("Client 7\nReason: No reason supplied by detector"),"missing
        name and reason fallback");

        CS

        dotnet run --project "$T" --configuration Release

        '
    - name: Compile final plugin
      run: dotnet build LobbyGuardian/LobbyGuardian.Plugin.csproj --configuration Release --no-restore --no-incremental
    - name: Package compiled plugin
      shell: bash
      run: "python3 - <<'PY'\nfrom pathlib import Path\nimport zipfile,hashlib\nasset=Path('fusionApp/src/main/assets/BepInEx-arm64.zip')\n\
        dll=Path('LobbyGuardian/bin/Release/net10.0/LobbyGuardian.Plugin.dll').read_bytes()\nfor marker in (b'WhitelistOnlyKick',b'SweepWhitelistOnly',b'_cycleRoundLimit',b'KickEveryoneExceptWhitelist'):\n\
        \    assert marker in dll,marker\nfor marker in ('rounds','RaidTargetVoteRepeat','RaidTargetVoteFour','LobbyGuardian-whitelist-kick-status.json'):\n\
        \    assert marker.encode('utf-16le') in dll,marker\nwith zipfile.ZipFile(asset) as old, zipfile.ZipFile(asset.with_suffix('.new.zip'),'w',compression=zipfile.ZIP_DEFLATED)\
        \ as new:\n    for item in old.infolist():\n        if item.filename.rsplit('/',1)[-1].lower()=='lobbyguardian.plugin.dll':continue\n\
        \        new.writestr(item,old.read(item))\n    new.writestr('plugins/LobbyGuardian.Plugin.dll',dll)\nasset.with_suffix('.new.zip').replace(asset)\n\
        print('Final plugin SHA256:',hashlib.sha256(dll).hexdigest())\nPY"
