      uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
    - uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    - uses: gradle/actions/setup-gradle@v4
    - name: Install PyYAML
      run: python3 -m pip install --user PyYAML
    - name: Recreate original v4.3.47 source stages
      shell: bash
      run: "python3 - <<'PY_BASE'\nfrom pathlib import Path\nimport subprocess, tempfile, yaml\nold=Path('.github/workflows/lobbyguardian-v4347-report-review.yml')\n\
        steps=yaml.safe_load(old.read_text())['jobs']['android']['steps']\nfor step in steps:\n    name=step.get('name','')\n\
        \    if name=='Build v4.3.47 Android APK': break\n    if not step.get('run') or name=='Install PyYAML': continue\n\
        \    print('>>> '+name,flush=True)\n    with tempfile.NamedTemporaryFile(mode='w',encoding='utf8',suffix='.sh',delete=False)\
        \ as f:\n        f.write(step['run']); script=f.name\n    try: subprocess.run(['bash','-eo','pipefail',script],check=True)\n\
        \    finally: Path(script).unlink(missing_ok=True)\nelse: raise RuntimeError('Missing original v4.3.47 build anchor')\n\
