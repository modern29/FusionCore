    - name: Add independent suspected hacker alerts
      shell: bash
      run: |
        python3 - <<'PY_ALERT'
        from pathlib import Path
        import re
        root=Path('LobbyGuardian/Plugin')
        p=root/'BauStyleAntiCheat.cs';s=p.read_text()
        # Notify on an existing detector finding, before any auto-ban decision.
        anchor=re.search(r'Finding\?\s+finding\s*=\s*Inspect\([^;]*\);',s)
        assert anchor, 'Anti-cheat finding anchor not found'
        sig=re.search(r'\bBeforeRpc\s*\(\s*object\??\s+(\w+)\s*,',s)
        assert sig, 'RPC callback argument not found'
        instance=sig.group(1)
        s=s[:anchor.end()]+"\n            if(finding!=null) GuardianHackerAlerts.Observe("+instance+",rpc,finding);"+s[anchor.end():]
        p.write_text(s)
        (root/'GuardianHackerAlerts.cs').write_text('''using System;
        using System.Collections.Generic;
        using System.IO;
        using System.Linq;
        using System.Reflection;
        using System.Text.Json;
        using BepInEx;
        namespace LobbyGuardian;
        internal static class GuardianHackerAlerts {
            private static readonly Dictionary<string,DateTimeOffset> Seen=new();
            private static int Room;
            private const BindingFlags F=BindingFlags.Public|BindingFlags.NonPublic|BindingFlags.Instance;
            private static object? Read(object? o,string key){
                if(o==null)return null;
                try{return o.GetType().GetProperty(key,F)?.GetValue(o)??o.GetType().GetField(key,F)?.GetValue(o);}catch{return null;}
            }
            internal static void Observe(object? instance,object? rpc,object? finding){
                try{
                    if(!GameBridge.IsHost()||!GameBridge.IsConnectedSession())return;
                    string file=Path.Combine(Paths.ConfigPath,"LobbyGuardian-utility-options.json");
                    if(File.Exists(file)){
                        using var d=JsonDocument.Parse(File.ReadAllText(file));
                        if(d.RootElement.TryGetProperty("HackerAlerts",out var flag)&&flag.ValueKind==JsonValueKind.False)return;
                    }
                    int room=GameBridge.SessionRoom;
                    if(room!=Room){Room=room;Seen.Clear();}
                    string reason=Read(finding,"Reason")?.ToString()??rpc?.ToString()??"Unexpected game action";
                    if(reason.Length>140)reason=reason.Substring(0,140);
                    bool knownOwner=int.TryParse((Read(instance,"OwnerId")??Read(instance,"ownerId"))?.ToString(),out int owner);
                    string who="Unknown sender";
                    if(knownOwner){
                        var matches=GameBridge.ReadConnectedPlayers().Where(x=>x.ClientId==owner&&!x.IsLocal).Take(2).ToArray();
                        if(matches.Length==1&&!string.IsNullOrWhiteSpace(matches[0].Name))who="Possible player: "+matches[0].Name;
                    }
                    var now=DateTimeOffset.UtcNow;
                    string key=who+"|"+reason;
                    if(Seen.TryGetValue(key,out var last)&&now-last<TimeSpan.FromSeconds(15))return;
                    if(Seen.Count>=128)Seen.Clear();
                    Seen[key]=now;
                    HostExtras.Warn("Suspected hacker activity — "+who+" — "+reason+" (sender unverified)","hacker-alert");
                }catch{}
            }
        }
        ''')
        p=Path('fusionApp/src/main/java/dev/allofus/fusioncore/GuardianUnifiedExtras.java');s=p.read_text()
        anchor='protectionToggle(a,p,"hackers","AutoBanHackers");'
        assert s.count(anchor)==1
        s=s.replace(anchor,anchor+'\n        check(a,p,"Hacker detection alerts","Show suspected cheating warnings even when auto-ban is OFF",UTILITY,"HackerAlerts",true);',1)
        p.write_text(s)
        print('Independent hacker detection alert and toggle installed')
        PY_ALERT
