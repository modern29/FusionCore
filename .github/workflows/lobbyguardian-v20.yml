# v2.0: client vote kick and optional one-shot network reconnect; no moderation bypass.
# Lobby Guardian Android candidate builder
# This file builds original open-source FusionCore plus an independent experimental plugin.
# It does not change your installed Among Us APK or use account tokens.
# Embedded source archive SHA-256: 0a9e4c4b0f7807c7cee91f064400a6957778550fe9c08c538364d1d1ef868fd9
name: Lobby Guardian Android v2.0 (non-host vote + reconnect)
on:
  push:
    paths:
      - '.github/workflows/lobbyguardian-v20.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout your FusionCore fork
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
