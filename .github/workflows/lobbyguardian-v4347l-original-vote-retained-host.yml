    - name: Compile and test host rule behavior
      shell: bash
      run: 'set -e

        T=$(mktemp -d)

        dotnet new console --framework net10.0 --output "$T" --no-restore

        cp LobbyGuardian/Plugin/ModerationRules.cs "$T/ModerationRules.cs"

        cat > "$T/Program.cs" <<''CS''

        using System;

        using LobbyGuardian;

        static void Check(bool ok,string label){if(!ok)throw new Exception(label);Console.WriteLine("PASS "+label);}

        var r=new RuleSettings();

        var p=new PlayerIdentity{ClientId=7,FriendCode="guest#1234",Puid="guest-id",Name="Guest"};

        r.AllowFriendCodes.Add("trusted#0000");

        Check(ModerationRules.OnJoin(r,p,true).Action==ModerationAction.Allow,"default off");

        r.KickEveryoneExceptWhitelist=true;

        Check(ModerationRules.OnJoin(r,p,true).Action==ModerationAction.Kick,"new kick rule");

        Check(ModerationRules.OnJoin(r,p,false).Action==ModerationAction.Allow,"host only");

        p.FriendCode="trusted#0000";Check(ModerationRules.OnJoin(r,p,true).Action==ModerationAction.Allow,"whitelist protected");

        p.FriendCode="guest#1234";

        r.AutoBanEnabled=true;r.BanFriendCodes.Add(p.FriendCode);

        Check(ModerationRules.OnJoin(r,p,true).Action==ModerationAction.Ban,"original explicit ban precedence");

        r.BanFriendCodes.Clear();

        Check(ModerationRules.OnJoin(r,p,true).Action==ModerationAction.Kick,"bulk kick independent of enabled explicit bans");

        r.BanEveryone=true;

        Check(ModerationRules.OnJoin(r,p,true).Action==ModerationAction.Ban,"original bulk ban precedence");

        r.BanEveryone=false;r.AutoBanEnabled=false;r.KickEveryoneExceptWhitelist=false;

        Check(ModerationRules.OnJoin(r,p,true).Action==ModerationAction.Allow,"new switch off");

        r.AutoKickEnabled=true;r.KickFriendCodes.Add(p.FriendCode);

        Check(ModerationRules.OnJoin(r,p,true).Action==ModerationAction.Kick,"original kick list unchanged");

        CS

        dotnet run --project "$T" --configuration Release

        '
    - name: Compile and test the actual moderation alert formatter
      shell: bash
      run: 'set -e

        T=$(mktemp -d)

        dotnet new console --framework net10.0 --output "$T" --no-restore

        cp LobbyGuardian/Plugin/HostExtras.cs "$T/HostExtras.cs"

        cp LobbyGuardian/Plugin/ModerationRules.cs "$T/ModerationRules.cs"

        cat > "$T/Stubs.cs" <<''CS''

        namespace BepInEx { public static class Paths { public static string ConfigPath => System.IO.Path.GetTempPath(); }
        }

        namespace LobbyGuardian { internal static class GameBridge { public static bool IsHost()=>true; } }

        CS

        cat > "$T/Program.cs" <<''CS''

        using LobbyGuardian;

        static void Check(bool ok,string name){if(!ok)throw new Exception(name);Console.WriteLine("PASS "+name);}

        var p=new PlayerIdentity{ClientId=7,Name="Player#3848"};

        var kick=HostExtras.FormatModerationNotice("kick",p,"Not on host whitelist",true);

        Check(kick.Contains("KICK sent: Player#3848") && kick.Contains("Reason: Not on host whitelist") && kick.Contains("Server
        outcome unconfirmed"),"kick reason and status");

        var ban=HostExtras.FormatModerationNotice("ban",p,"Friend Code blacklist",true);

        Check(ban.Contains("BAN sent: Player#3848") && ban.Contains("Reason: Friend Code blacklist"),"ban reason");

        var failed=HostExtras.FormatModerationNotice("kick",p,"Manual host action",false);

        Check(failed.Contains("FAILED") && failed.Contains("Reason: Manual host action") && !failed.Contains("sent:"),"failure
        not shown as sent");

        p.Name="";

        Check(HostExtras.FormatModerationNotice("ban",p,"",true).Contains("Client 7\nReason: No reason supplied by detector"),"missing
        name and reason fallback");

        CS

        dotnet run --project "$T" --configuration Release

        '
    - name: Compile final plugin
      run: dotnet build LobbyGuardian/LobbyGuardian.Plugin.csproj --configuration Release --no-restore --no-incremental
    - name: Package compiled plugin
      shell: bash
      run: "python3 - <<'PY'\nfrom pathlib import Path\nimport zipfile,hashlib\nasset=Path('fusionApp/src/main/assets/BepInEx-arm64.zip')\n\
        dll=Path('LobbyGuardian/bin/Release/net10.0/LobbyGuardian.Plugin.dll').read_bytes()\nfor marker in (b'WhitelistOnlyKick',b'SweepWhitelistOnly',b'KickEveryoneExceptWhitelist'):\n\
        \    assert marker in dll,marker\nfor marker in ('LobbyGuardian-whitelist-kick-status.json',):\n    assert marker.encode('utf-16le')\
        \ in dll,marker\nwith zipfile.ZipFile(asset) as old, zipfile.ZipFile(asset.with_suffix('.new.zip'),'w',compression=zipfile.ZIP_DEFLATED)\
        \ as new:\n    for item in old.infolist():\n        if item.filename.rsplit('/',1)[-1].lower()=='lobbyguardian.plugin.dll':continue\n\
        \        new.writestr(item,old.read(item))\n    new.writestr('plugins/LobbyGuardian.Plugin.dll',dll)\nasset.with_suffix('.new.zip').replace(asset)\n\
        print('Final plugin SHA256:',hashlib.sha256(dll).hexdigest())\nPY"
