    - name: Run moderation policy regression tests
      shell: bash
      run: 'mkdir -p /tmp/lg-policy-tests

        cp LobbyGuardian/Plugin/AutoBanPolicy.cs /tmp/lg-policy-tests/

        cat > /tmp/lg-policy-tests/PolicyTests.csproj <<''EOF''

        <Project Sdk="Microsoft.NET.Sdk"><PropertyGroup><OutputType>Exe</OutputType><TargetFramework>net10.0</TargetFramework><ImplicitUsings>enable</ImplicitUsings><Nullable>enable</Nullable></PropertyGroup></Project>

        EOF

        cat > /tmp/lg-policy-tests/Program.cs <<''EOF''

        using LobbyGuardian;

        static void Check(bool actual,bool expected,string name){if(actual!=expected)throw new Exception(name);}

        Check(AutoBanPolicy.Numbered("abc1#1234"),true,"number in prefix");

        Check(AutoBanPolicy.EffectiveBan(false,true,true),false,"numbered automatic ban becomes kick");

        Check(AutoBanPolicy.EffectiveBan(false,true,false),true,"other ban unchanged");

        Check(AutoBanPolicy.EffectiveBan(true,true,true),true,"manual ban unchanged");

        Check(AutoBanPolicy.Permits(false,false,true,false,true,true,true,true,false,0),true,"first numbered kick");

        Check(AutoBanPolicy.Permits(false,false,true,false,true,true,true,true,false,2),false,"third numbered kick blocked");

        Check(AutoBanPolicy.Permits(false,false,true,false,true,true,true,false,false,0),false,"bot switch off blocks numbered
        kick");

        Check(AutoBanPolicy.Numbered("abc#1234"),false,"normal numeric suffix");

        Check(AutoBanPolicy.Permits(false,true,true,false,true,true,true,true,false,0),true,"first bot ban");

        Check(AutoBanPolicy.Permits(false,true,true,false,true,true,true,true,false,1),true,"second bot ban");

        Check(AutoBanPolicy.Permits(false,true,true,false,true,true,true,true,false,2),false,"third bot ban");

        Check(AutoBanPolicy.Permits(false,true,false,true,true,true,true,true,true,2),false,"hacker label cannot bypass cap");

        Check(AutoBanPolicy.Permits(false,true,true,false,false,false,true,false,true,0),false,"bots off hackers on");

        Check(AutoBanPolicy.Permits(false,true,false,true,true,true,true,false,true,0),false,"numbered hacker candidate protected
        when bots off");

        Check(AutoBanPolicy.Permits(false,true,false,true,false,true,true,false,true,0),false,"suspected bot protected when
        bots off");

        Check(AutoBanPolicy.Permits(false,true,false,true,false,false,true,false,true,0),true,"independent hacker switch");

        Check(AutoBanPolicy.Permits(false,true,false,true,false,false,true,true,false,0),false,"hackers off");

        Check(AutoBanPolicy.Permits(false,true,false,false,false,false,true,true,true,0),false,"unclassified auto ban");

        Check(AutoBanPolicy.Permits(false,true,true,false,false,false,false,true,true,0),false,"unknown code fail closed");

        Check(AutoBanPolicy.Permits(true,true,false,false,true,true,true,false,false,2),true,"manual action independent");

        Check(AutoBanPolicy.Numbered("abc1"),true,"prefix before suffix arrives");

        Check(AutoBanPolicy.Numbered("abc1#bad"),true,"malformed suffix still numbered");

        Check(AutoBanPolicy.Numbered("abc#1234"),false,"normal suffix does not count");

        Check(AutoBanPolicy.SelectedBan(false,true,true,true,false,true),false,"bot kick overrides detector ban");

        Check(AutoBanPolicy.SelectedBan(false,false,true,true,true,false),true,"bot ban overrides detector kick");

        Check(AutoBanPolicy.SelectedBan(false,true,false,true,true,false),false,"hacker kick independent of bot ban");

        Check(AutoBanPolicy.SelectedBan(false,false,false,true,false,true),true,"hacker ban independent of bot kick");

        Check(AutoBanPolicy.SelectedBan(false,true,true,false,true,true),false,"unknown identity cannot ban");

        Check(AutoBanPolicy.SelectedBan(true,true,true,true,false,false),true,"manual ban unchanged");

        Check(AutoBanPolicy.SelectedBan(true,false,false,true,true,true),false,"manual kick unchanged");

        Console.WriteLine("30 moderation policy checks passed");

        EOF

        dotnet run --project /tmp/lg-policy-tests/PolicyTests.csproj

        '
