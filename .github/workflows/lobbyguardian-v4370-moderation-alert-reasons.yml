        for step in steps:\n    name=step.get('name','')\n    if name=='Build v4.3.62 Android APK': break\n    if not step.get('run')\
        \ or name=='Install PyYAML': continue\n    print('>>> '+name,flush=True)\n    with tempfile.NamedTemporaryFile(mode='w',encoding='utf8',suffix='.sh',delete=False)\
        \ as f:\n        f.write(step['run']); filename=f.name\n    try: subprocess.run(['bash','-eo','pipefail',filename],check=True)\n\
