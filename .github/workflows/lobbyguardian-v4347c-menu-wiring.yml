        dll=Path('LobbyGuardian/bin/Release/net10.0/LobbyGuardian.Plugin.dll').read_bytes()\nfor marker in (b'WhitelistOnlyKick',b'SweepWhitelistOnly',b'_cycleRoundLimit',b'KickEveryoneExceptWhitelist',b'DispatchHostDecision'):\n\
        \    assert marker in dll,marker\nfor marker in ('VoteRejoinFour','RaidTargetVoteRepeat','RaidTargetVoteFour'):\n\
        \    assert marker.encode('utf-16le') in dll,marker\nwith zipfile.ZipFile(asset) as old, zipfile.ZipFile(asset.with_suffix('.new.zip'),'w',compression=zipfile.ZIP_DEFLATED)\
        \ as new:\n    for item in old.infolist():\n        if item.filename.rsplit('/',1)[-1].lower()=='lobbyguardian.plugin.dll':continue\n\
        \        new.writestr(item,old.read(item))\n    new.writestr('plugins/LobbyGuardian.Plugin.dll',dll)\nasset.with_suffix('.new.zip').replace(asset)\n\
        print('Final plugin SHA256:',hashlib.sha256(dll).hexdigest())\nPY"
