        ); r.AllowNamesExact.Add(\"Trusted\");\nr.AutoBanEnabled=true; r.BanFriendCodes.Add(\"blocked#0000\");\n\
        var p=new PlayerIdentity {ClientId=9,FriendCode=\"blocked#0000\",Puid=\"other-puid\",Name=\"Guest\"};\n\
        Check(ModerationRules.OnJoin(r,p,true).Action==ModerationAction.Ban,\"original ban list still works\");\n\
        Check(ModerationRules.WhitelistOnlyKick(r,p,true).Action==ModerationAction.Kick,\"new admission rule never\
        \ bans\");\nCheck(ModerationRules.WhitelistOnlyKick(r,p,false).Action==ModerationAction.Allow,\"non-host\
        \ no action\");\np.IsLocal=true;Check(ModerationRules.WhitelistOnlyKick(r,p,true).Action==ModerationAction.Allow,\"\
        self excluded\");p.IsLocal=false;\np.IsHost=true;Check(ModerationRules.WhitelistOnlyKick(r,p,true).Action==ModerationAction.Allow,\"\
