    - name: Regression tests for shared host kick and original ban rules
      shell: bash
      run: 'set -e

        T=$(mktemp -d)

        dotnet new console --framework net10.0 --output "$T" --no-restore

        cp LobbyGuardian/Plugin/ModerationRules.cs "$T/ModerationRules.cs"

        cat > "$T/Program.cs" <<''CS''

        using System;

        using LobbyGuardian;

        static void Check(bool ok,string label){if(!ok)throw new Exception(label);Console.WriteLine("PASS "+label);}

        var r=new RuleSettings();

        var p=new PlayerIdentity {ClientId=7,FriendCode="visitor#1234",Puid="visitor-id",Name="Visitor"};

        r.AllowFriendCodes.Add("trusted#0000");

        Check(ModerationRules.OnJoin(r,p,true).Action==ModerationAction.Allow,"new option defaults OFF");

        r.KickEveryoneExceptWhitelist=true;

        Check(ModerationRules.OnJoin(r,p,true).Action==ModerationAction.Kick,"kick mode independent of auto-ban
        and kick list switches");

        Check(ModerationRules.OnJoin(r,p,false).Action==ModerationAction.Allow,"host only");

        p.FriendCode="trusted#0000";

        Check(ModerationRules.OnJoin(r,p,true).Action==ModerationAction.Allow,"whitelist protected");

        p.FriendCode="visitor#1234";

        r.AutoBanEnabled=true;r.BanEveryone=true;

        Check(ModerationRules.OnJoin(r,p,true).Action==ModerationAction.Kick,"kick mode wins over bulk ban if both
        enabled");

        r.BanFriendCodes.Add(p.FriendCode);

        Check(ModerationRules.OnJoin(r,p,true).Action==ModerationAction.Ban,"explicit original ban list preserved");

        r.BanFriendCodes.Clear();r.KickEveryoneExceptWhitelist=false;

        Check(ModerationRules.OnJoin(r,p,true).Action==ModerationAction.Ban,"original bulk ban restored when kick
        option OFF");

        r.BanEveryone=false;r.AutoBanEnabled=false;r.AutoKickEnabled=true;r.KickFriendCodes.Add(p.FriendCode);

        Check(ModerationRules.OnJoin(r,p,true).Action==ModerationAction.Kick,"original kick list preserved");

        CS

        dotnet run --project "$T" --configuration Release

        python3 - <<''PY''

        from pathlib import Path

        p=Path(''LobbyGuardian/Plugin/LobbyGuardianPlugin.cs'').read_text()

        assert ''DispatchHostDecision(player,decision,"player-joined")'' in p

        assert ''DispatchHostDecision(player,decision,"whitelist-only")'' in p

        assert ''GameBridge.Ban(player):GameBridge.Kick(player)'' in p

        bridge=Path(''LobbyGuardian/Plugin/GameBridge.cs'').read_text()

        assert ''method.Invoke(client, new object[] { player.ClientId, false });'' in bridge

        print(''Native kick argument and shared dispatch verified in source'')

        PY'
