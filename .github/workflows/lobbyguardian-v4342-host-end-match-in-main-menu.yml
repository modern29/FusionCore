name: Lobby Guardian v4.3.42 - Host End Game in Original Guardian Menu
'on':
  push:
    paths:
    - .github/workflows/lobbyguardian-v4342-host-end-match-in-main-menu.yml
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
    - name: Checkout FusionCore
      uses: actions/checkout@v4
    - name: Java 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
    - name: .NET 10
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    - name: Gradle
      uses: gradle/actions/setup-gradle@v4
    - name: Install PyYAML
      run: python3 -m pip install --user PyYAML
    - name: Recreate v4.3.38 source stages without oversized Bash arguments
      shell: bash
      run: "python3 - <<'PY_BASELINE'\nfrom pathlib import Path\nimport subprocess,yaml,tempfile\nsource=Path('.github/workflows/lobbyguardian-v4338-fix-ghost-chat-alwayschat-ghosts-vents-spoof.yml')\n\
        assert source.is_file(), 'Previous successful v4.3.38 workflow not found'\nold=yaml.safe_load(source.read_text(encoding='utf8'))\n\
        steps=old['jobs']['android']['steps']\nassert sum(s.get('name')=='Build v4.3.38 Android candidate APK' for\
        \ s in steps)==1\ncount=0\nfor step in steps:\n    name=step.get('name','')\n    if name=='Build v4.3.38\
        \ Android candidate APK':break\n    if not step.get('run') or name=='Install PyYAML':continue\n    print('>>>\
        \ BASELINE '+name,flush=True)\n    with tempfile.NamedTemporaryFile(mode='w',encoding='utf8',suffix='.sh',delete=False)\
        \ as temp:\n        temp.write(step['run'])\n        script_file=temp.name\n    try:\n        subprocess.run(['bash','-eo','pipefail',script_file],check=True)\n\
        \    finally:\n        Path(script_file).unlink(missing_ok=True)\n    count+=1\nassert count>=18, 'Not enough\
        \ source stages were reproduced'\nprint('Recreated v4.3.38 game and Android sources from the pinned successful\
        \ workflow:',count,'stages')\nPY_BASELINE\n"
    - name: Fix GameCode resolver, name-on-join and Android copy-on-exit
      shell: bash
      run: "python3 - <<'PY_PATCH'\nfrom pathlib import Path\nimport zlib,base64,subprocess\ns=\"\"\
        \nfile=Path('/tmp/patch_guardian_4339.py')\nfile.write_bytes(zlib.decompress(base64.b64decode(s)))\nsubprocess.run(['python3',str(file)],check=True)\n\
        PY_PATCH\ndotnet build LobbyGuardian/LobbyGuardian.Plugin.csproj --configuration Release --no-restore\n\
        python3 - <<'PY_DLL'\nfrom pathlib import Path\nimport os,zipfile\nasset=Path('fusionApp/src/main/assets/BepInEx-arm64.zip')\n\
        dll=Path('LobbyGuardian/bin/Release/net10.0/LobbyGuardian.Plugin.dll')\nassert asset.is_file() and dll.is_file(),\
        \ 'Compiled plugin or bundled BepInEx runtime missing'\ntemp=asset.with_suffix('.code4339.zip')\nwith zipfile.ZipFile(asset)\
        \ as old,zipfile.ZipFile(temp,'w') as fresh:\n    prefix=next((n[:-len('core/BepInEx.Core.dll')] for n in\
        \ old.namelist() if n.endswith('core/BepInEx.Core.dll')),None)\n    assert prefix is not None, 'BepInEx\
        \ core missing'\n    target=prefix+'plugins/LobbyGuardian.Plugin.dll'\n    for entry in old.infolist():\n\
        \        if entry.filename!=target:fresh.writestr(entry,old.read(entry.filename))\n    fresh.write(dll,target,compress_type=zipfile.ZIP_DEFLATED)\n\
        os.replace(temp,asset)\nprint('Lobby Guardian 4.3.39 game/plugin and Android native clipboard bridge bundled')\n\
        PY_DLL\n"
    - name: Add selective host-only anti-flood defense, disconnect incident recorder, original Guardian controls
        and local self-test
      shell: bash
      run: "python3 - <<'PY_REPAIR_4340'\nimport zlib,base64,pathlib,subprocess\nroot=pathlib.Path('/tmp/guardian4340')\n\
        root.mkdir(parents=True,exist_ok=True)\n(root/'HostResilienceShield.cs').write_bytes(zlib.decompress(base64.b64decode(\"\
        \"\
        )))\n(root/'patch.py').write_bytes(zlib.decompress(base64.b64decode(\"\"\
        )))\nsubprocess.run(['python3',str(root/'patch.py')],check=True)\nPY_REPAIR_4340\ndotnet build LobbyGuardian/LobbyGuardian.Plugin.csproj\
        \ --configuration Release --no-restore\npython3 - <<'PY_REBUNDLE_4340'\nimport zipfile,os\nfrom pathlib\
        \ import Path\nasset=Path('fusionApp/src/main/assets/BepInEx-arm64.zip')\ndll=Path('LobbyGuardian/bin/Release/net10.0/LobbyGuardian.Plugin.dll')\n\
        assert asset.is_file() and dll.is_file(),'Patched host defense DLL or runtime missing'\nwith zipfile.ZipFile(asset)\
        \ as original:\n    prefix=next((x[:-len('core/BepInEx.Core.dll')] for x in original.namelist() if x.endswith('core/BepInEx.Core.dll')),None)\n\
        \    assert prefix is not None,'BepInEx core missing'\n    name=prefix+'plugins/LobbyGuardian.Plugin.dll'\n\
        \    replacement=asset.with_name('guardian4340-bepinex.zip')\n    with zipfile.ZipFile(replacement,'w')\
        \ as target:\n        for item in original.infolist():\n            if item.filename!=name:target.writestr(item,original.read(item.filename))\n\
        \        target.write(dll,name,compress_type=zipfile.ZIP_DEFLATED)\n    assert replacement.stat().st_size>100000\n\
        \    os.replace(replacement,asset)\nprint('v4.3.40 host shield DLL has been rebuilt and embedded in Android\
        \ runtime')\nPY_REBUNDLE_4340\n"
    - name: Repair name-on-join setting race, actual chat HUD controls and host-only start button; recompile
      shell: bash
      run: "python3 - <<'PY_FIX_4341'\nimport base64,zlib,subprocess\nfrom pathlib import Path\nscript=Path('/tmp/guardian4341_fix.py')\n\
        script.write_bytes(zlib.decompress(base64.b64decode('')))\n\
        subprocess.run(['python3',str(script)],check=True)\nPY_FIX_4341\ndotnet build LobbyGuardian/LobbyGuardian.Plugin.csproj\
        \ --configuration Release --no-restore\npython3 - <<'PY_REBUNDLE_4341'\nfrom pathlib import Path\nimport\
        \ zipfile,os\nasset=Path('fusionApp/src/main/assets/BepInEx-arm64.zip')\ndll=Path('LobbyGuardian/bin/Release/net10.0/LobbyGuardian.Plugin.dll')\n\
        assert asset.is_file() and dll.is_file(), 'Compiled plugin and embedded runtime required'\nreplacement=asset.with_name('guardian4341-bepinex.zip')\n\
        with zipfile.ZipFile(asset) as original,zipfile.ZipFile(replacement,'w') as updated:\n    prefix=next((v[:-len('core/BepInEx.Core.dll')]\
        \ for v in original.namelist() if v.endswith('core/BepInEx.Core.dll')),None)\n    assert prefix is not None,\
        \ 'BepInEx runtime core missing'\n    dest=prefix+'plugins/LobbyGuardian.Plugin.dll'\n    for info in original.infolist():\n\
        \        if info.filename!=dest:updated.writestr(info,original.read(info.filename))\n    updated.write(dll,dest,compress_type=zipfile.ZIP_DEFLATED)\n\
        os.replace(replacement,asset)\nprint('v4.3.41: updated C# plugin bundled. Clipboard on leave remains untouched.')\n\
        PY_REBUNDLE_4341\n"
    - name: Add host-only End Game with confirmation, original Guardian Host menu and normal RPC
      shell: bash
      run: "python3 - <<'PY_END_4342'\nfrom pathlib import Path\nimport base64,zlib,subprocess\nPath('/tmp/guardian-4342-end.cs').write_bytes(zlib.decompress(base64.b64decode('')))\n\
        Path('/tmp/guardian-4342-patch.py').write_bytes(zlib.decompress(base64.b64decode('')))\n\
        subprocess.run(['python3','/tmp/guardian-4342-patch.py'],check=True)\nPY_END_4342\ndotnet build LobbyGuardian/LobbyGuardian.Plugin.csproj\
        \ --configuration Release --no-restore\npython3 - <<'PY_REBUNDLE_END_4342'\nfrom pathlib import Path\nimport\
        \ zipfile,os\nasset=Path('fusionApp/src/main/assets/BepInEx-arm64.zip')\ndll=Path('LobbyGuardian/bin/Release/net10.0/LobbyGuardian.Plugin.dll')\n\
        assert asset.is_file() and dll.is_file(), 'End Game DLL or embedded BepInEx runtime missing'\nreplacement=asset.with_name('guardian4342-bepinex.zip')\n\
        with zipfile.ZipFile(asset) as original, zipfile.ZipFile(replacement,'w') as updated:\n    prefix=next((n[:-len('core/BepInEx.Core.dll')]\
        \ for n in original.namelist() if n.endswith('core/BepInEx.Core.dll')),None)\n    assert prefix is not None,'Embedded\
        \ BepInEx runtime missing'\n    target=prefix+'plugins/LobbyGuardian.Plugin.dll'\n    for item in original.infolist():\n\
        \        if item.filename!=target: updated.writestr(item,original.read(item.filename))\n    updated.write(dll,target,compress_type=zipfile.ZIP_DEFLATED)\n\
        os.replace(replacement,asset)\nprint('v4.3.42 game-side host end logic bundled; v4.3.41 name, chat and host-start\
        \ fixes retained')\nPY_REBUNDLE_END_4342\n"
    - name: Build v4.3.42 Android APK
      shell: bash
      run: "python3 - <<'PY_BUILD'\nfrom pathlib import Path\nimport subprocess,yaml,tempfile\nold=yaml.safe_load(Path('.github/workflows/lobbyguardian-v4338-fix-ghost-chat-alwayschat-ghosts-vents-spoof.yml').read_text(encoding='utf8'))\n\
        steps=old['jobs']['android']['steps']\nitem=next(s for s in steps if s.get('name')=='Build v4.3.38 Android\
        \ candidate APK')\nassert item.get('run'), 'Missing v4.3.38 APK packaging script'\nwith tempfile.NamedTemporaryFile(mode='w',encoding='utf8',suffix='.sh',delete=False)\
        \ as temp:\n    temp.write(item['run'])\n    script_file=temp.name\ntry:\n    subprocess.run(['bash','-eo','pipefail',script_file],check=True)\n\
        finally:\n    Path(script_file).unlink(missing_ok=True)\nprint('v4.3.39 Android APK assembly completed')\n\
        PY_BUILD\n"
    - name: Upload v4.3.42 Android APK
      uses: actions/upload-artifact@v4
      with:
        name: LobbyGuardian-v4.3.42-Android-Host-EndGame
        path: fusionApp/build/outputs/apk/debug/*.apk
        if-no-files-found: error
    - name: Upload v4.3.42 plugin source and diagnostics
      uses: actions/upload-artifact@v4
      with:
        name: LobbyGuardian-v4.3.42-Sources-Diagnostics
        path: 'LobbyGuardian/Plugin/*.cs

          fusionApp/src/main/java/dev/allofus/fusioncore/GuardianUnifiedExtras.java

          LobbyGuardian/Plugin/HostResilienceShield.cs

          LobbyGuardian/Plugin/HostEndGame.cs

          '
        if-no-files-found: error
