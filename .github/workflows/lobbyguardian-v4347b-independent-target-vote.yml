name: Lobby Guardian v4.3.47b - Separate target vote settings
'on':
  push:
    paths:
    - .github/workflows/lobbyguardian-v4347b-independent-target-vote.yml
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
    - name: Checkout original repo
      uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
    - uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    - uses: gradle/actions/setup-gradle@v4
    - name: Install PyYAML
      run: python3 -m pip install --user PyYAML
    - name: Recreate original v4.3.47 source stages
      shell: bash
      run: |-
        python3 - <<'PY_BASE'
        from pathlib import Path
        import subprocess, tempfile, yaml
        old=Path('.github/workflows/lobbyguardian-v4347-report-review.yml')
        steps=yaml.safe_load(old.read_text())['jobs']['android']['steps']
        for step in steps:
            name=step.get('name','')
            if name=='Build v4.3.47 Android APK': break
            if not step.get('run') or name=='Install PyYAML': continue
            print('>>> '+name,flush=True)
            with tempfile.NamedTemporaryFile(mode='w',encoding='utf8',suffix='.sh',delete=False) as f:
                f.write(step['run']); script=f.name
            try: subprocess.run(['bash','-eo','pipefail',script],check=True)
            finally: Path(script).unlink(missing_ok=True)
        else: raise RuntimeError('Missing original v4.3.47 build anchor')
        PY_BASE
    - name: Verify base and apply two isolated additions
      shell: bash
      run: "python3 - <<'PY_PATCH'\nfrom pathlib import Path\nimport hashlib\nexpected={'LobbyGuardian/Plugin/ClientFeatures.cs':\
        \ '31d70980a901b636d85e6d2ba1abeae4f32c7a7045d974fa542ac9bb5713cc70', 'LobbyGuardian/Plugin/LobbyGuardianPlugin.cs':\
        \ '100a901c8c3629f5834042afe4edbf1eac818a0d87d8e2a75a0434a05449039f', 'LobbyGuardian/Plugin/ModerationRules.cs': 'fdfd64b94088ac7557e021a41c04ddaf70ee74331e115655d37b20120289fcb7',\
        \ 'fusionApp/src/main/java/dev/allofus/fusioncore/GuardianUnifiedExtras.java': '116deb8c1429421b7d44e5e7f56e4c214d657ef7d41acf4d5bb0bba20a47601c'}\n\
        for name,digest in expected.items():\n    assert hashlib.sha256(Path(name).read_bytes()).hexdigest()==digest, \"Base\
        \ source mismatch: \"+name\nfrom pathlib import Path\nroot=Path('LobbyGuardian/Plugin')\nui=Path('fusionApp/src/main/java/dev/allofus/fusioncore/GuardianUnifiedExtras.java')\n\
        def once(s,a,b):\n    assert s.count(a)==1,(a[:120],s.count(a))\n    return s.replace(a,b,1)\ndef edit(p,f):\n   \
        \ s=p.read_text(); t=f(s); assert t!=s,p; p.write_text(t)\n# Keep all previous rule code intact. The optional whitelist-only\
        \ admission mode uses existing identity matching.\ndef rules(s):\n    marker='    public static Decision OnVoteKickObserved('\n\
        \    return once(s,marker,'''    // Whitelist-only admission is independent of the existing kick and ban lists.\n\
        \    public static Decision WhitelistOnlyKick(RuleSettings rules, PlayerIdentity player, bool localIsHost)\n    {\n\
        \        if (!localIsHost || player.IsLocal || player.IsHost || player.ClientId < 0)\n            return new(ModerationAction.Allow,\
        \ \"Not an eligible host target\");\n        var fc = Norm(player.FriendCode);\n        var puid = Norm(player.Puid);\n\
        \        var name = Norm(player.Name);\n        if (In(rules.AllowFriendCodes, fc) || In(rules.AllowPuids, puid) ||\
        \ In(rules.AllowNamesExact, name))\n            return new(ModerationAction.Allow, \"Whitelist match\");\n       \
        \ // An incomplete identity must not cause an allowed player to be removed.\n        if ((fc.Length == 0 && puid.Length\
        \ == 0) ||\n            (fc.Length == 0 && rules.AllowFriendCodes?.Count > 0) ||\n            (puid.Length == 0 &&\
        \ rules.AllowPuids?.Count > 0) ||\n            (name.Length == 0 && rules.AllowNamesExact?.Count > 0))\n         \
        \   return new(ModerationAction.Allow, \"Whitelist identity not resolved\");\n        return new(ModerationAction.Kick,\
        \ \"Not on host whitelist\");\n    }\n\n'''+marker)\nedit(root/'ModerationRules.cs',rules)\n# Add an isolated, rate-limited\
        \ host lobby check, never send a ban from this new path.\ndef host(s):\n    s=once(s,'    private bool _firstEventSeen;','\
        \    private bool _firstEventSeen;\\n    private DateTimeOffset _nextWhitelistSweep;')\n    s=once(s,'ConnectionBotGuard.Tick();','ConnectionBotGuard.Tick();\
        \ Current?.SweepWhitelistOnly();')\n    anchor='    private void ProcessIdentity(PlayerIdentity player)'\n    s=once(s,anchor,'''\
        \    private void SweepWhitelistOnly()\n    {\n        var now = DateTimeOffset.UtcNow;\n        if (now < _nextWhitelistSweep)\
        \ return;\n        _nextWhitelistSweep = now.AddSeconds(1);\n        try\n        {\n            if (!GameBridge.IsHost()\
        \ || !ClientFeatures.IsLobby() || !ClientFeatures.IsConnectedPregame()) return;\n            var option = Path.Combine(Paths.ConfigPath,\
        \ \"LobbyGuardian-utility-options.json\");\n            if (!File.Exists(option)) return;\n            using var data\
        \ = System.Text.Json.JsonDocument.Parse(File.ReadAllText(option));\n            if (!data.RootElement.TryGetProperty(\"\
        KickEveryoneExceptWhitelist\", out var flag) ||\n                flag.ValueKind != System.Text.Json.JsonValueKind.True)\
        \ return;\n            // Never substitute default empty rules when a whitelist file is unreadable.\n            if\
        \ (!File.Exists(_rulesPath)) return;\n            var rules = System.Text.Json.JsonSerializer.Deserialize<RuleSettings>(File.ReadAllText(_rulesPath),\n\
        \                new System.Text.Json.JsonSerializerOptions { PropertyNameCaseInsensitive = true });\n           \
        \ if (rules is null || rules.AllowFriendCodes is null || rules.AllowPuids is null || rules.AllowNamesExact is null)\
        \ return;\n            foreach (var player in GameBridge.ReadVotingRoster())\n            {\n                var decision\
        \ = ModerationRules.WhitelistOnlyKick(rules, player, true);\n                if (decision.Action != ModerationAction.Kick)\
        \ continue;\n                if (!_banThrottle.CanSend(player.ClientId, now)) continue;\n                if (!GameBridge.IsHost()\
        \ || !ClientFeatures.IsConnectedPregame()) return;\n                bool sent = GameBridge.Kick(player);\n       \
        \         HostExtras.ModerationNotice(\"kick\", player, decision.Reason, sent);\n                _events?.Write(\"\
        whitelist-only\", sent ? \"kick-requested\" : \"kick-failed\", decision.Reason, player.Name);\n                break;\
        \ // at most one request per second; do not retry the same client within 30 seconds\n            }\n        }\n  \
        \      catch { /* Fail closed on unreadable settings or roster. */ }\n    }\n\n'''+anchor)\n    return s\nedit(root/'LobbyGuardianPlugin.cs',host)\n\
        # Existing vote state machine: configure the total round limit once at sequence start.\ndef client(s):\n    s=once(s,'\
        \    private static bool IsLobby()','    internal static bool IsConnectedPregame() => string.Equals(Get(GameBridge.Client,\
        \ \"GameState\")?.ToString(), \"Joined\", StringComparison.OrdinalIgnoreCase) && IsLobby();\\n\\n    internal static\
        \ bool IsLobby()')\n    s=once(s,'    private static string _cycleIdentity = \"\", _cycleTarget = \"\";','    private\
        \ static int _cycleRoundLimit = 3;\\n    private static string _cycleIdentity = \"\", _cycleTarget = \"\";')\n   \
        \ s=once(s,'                    _cycleAllTargets = false; _cycleForceThree = false;','                    _cycleAllTargets\
        \ = false; _cycleForceThree = false;\\n                    _cycleRoundLimit = ReadSetting(\"VoteRejoinFour\") ? 4\
        \ : 3;')\n    # Only the individual vote option changes. Keep group/host sequences at their original limit.\n    s=once(s,'\
        \        _cycleForceThree=true;','        _cycleForceThree=true;\\n        _cycleRoundLimit=3;')\n    s=once(s,'\"\
        Vote 1/3 requested; awaiting lobby/connection state before one normal rejoin\"','\"Vote 1/\" + _cycleRoundLimit +\
        \ \" requested; awaiting lobby/connection state before one normal rejoin\"')\n    s=once(s,'_cycleJoinRequests >=\
        \ 2','_cycleJoinRequests >= _cycleRoundLimit - 1')\n    s=once(s,'+ _cycleJoinRequests + \"/2; awaiting server acceptance\"\
        ','+ _cycleJoinRequests + \"/\" + (_cycleRoundLimit - 1) + \"; awaiting server acceptance\"')\n    # There are two\
        \ checks; the group path still starts with 3, the individual path can start with 4.\n    assert s.count('if (_cycleVotes\
        \ >= 3)')==2\n    s=s.replace('if (_cycleVotes >= 3)','if (_cycleVotes >= _cycleRoundLimit)')\n    s=once(s,'\"3/3\
        \ ordinary vote requests sent; game server decides counts and removal\"','_cycleVotes + \"/\" + _cycleRoundLimit +\
        \ \" ordinary vote requests sent; game server decides counts and removal\"')\n    s=once(s,'\"Vote \" + _cycleVotes\
        \ + \"/3 requested; exiting on the next game update\"','\"Vote \" + _cycleVotes + \"/\" + _cycleRoundLimit + \" requested;\
        \ exiting on the next game update\"')\n    return s\nedit(root/'ClientFeatures.cs',client)\n# Keep the v4.3.47 menu,\
        \ add just two controls. Use separate settings, not a new ban-rule schema.\ndef menu(s):\n    a='    public static\
        \ void addVoteAndActivity(Activity a,LinearLayout p){'\n    s=once(s,a,a+'''\n        title(a,p,\"Host \u2022 Whitelist-only\
        \ lobby\",\"Host-only, pregame. Kicks non-whitelisted players with resolved identities; never bans from this option.\"\
        );\n        check(a,p,\"Auto-kick everyone except whitelist\",\"OFF by default. One normal kick per second; existing\
        \ auto-ban list settings remain independent.\",UTILITY,\"KickEveryoneExceptWhitelist\",false);\n        title(a,p,\"\
        Individual vote sequence\",\"Choose total vote rounds. 3 rounds = up to 2 rejoins; 4 rounds = up to 3. Existing vote\
        \ sequence option must be enabled.\");\n        android.widget.RadioGroup rounds=new android.widget.RadioGroup(a);\n\
        \        rounds.setOrientation(LinearLayout.HORIZONTAL);\n        android.widget.RadioButton three=new android.widget.RadioButton(a),four=new\
        \ android.widget.RadioButton(a);\n        three.setId(View.generateViewId());four.setId(View.generateViewId());\n\
        \        three.setText(\"3 rounds\");four.setText(\"4 rounds\");three.setTextColor(FG);four.setTextColor(FG);\n  \
        \      rounds.addView(three);rounds.addView(four);p.addView(rounds,new LinearLayout.LayoutParams(-1,-2));\n      \
        \  final String voteSettings=\"LobbyGuardian-client-settings.json\";\n        rounds.check(enabled(a,voteSettings,\"\
        VoteRejoinFour\",false)?four.getId():three.getId());\n        rounds.setOnCheckedChangeListener((group,id)->set(a,voteSettings,\"\
        VoteRejoinFour\",id==four.getId()));\n''')\n    return s\nedit(ui,menu)\nprint('v4.3.47 source patch applied: isolated\
        \ whitelist-only kick mode and individual 3/4 round selector')\n\nPY_PATCH"
    - name: Add isolated target vote repeat settings
      shell: bash
      run: |-
        python3 - <<'PY_TARGET'
        from pathlib import Path
        root=Path('LobbyGuardian/Plugin')
        ui=Path('fusionApp/src/main/java/dev/allofus/fusioncore/GuardianUnifiedExtras.java')
        def once(s,a,b):
            assert s.count(a)==1,(a[:100],s.count(a))
            return s.replace(a,b,1)
        p=root/'LobbyRaidGuard.cs'; s=p.read_text()
        s=once(s,'// A single vote per room/identity per app session; no leave/rejoin repetition.','// One target command per room/identity; client owns any optional bounded sequence.')
        s=once(s,'type="vote-kick",targetClientId=p.ClientId','type="vote-target-auto",targetClientId=p.ClientId')
        s=once(s,'"One standard vote queued for "+p.Name+"; game threshold still applies; no automatic repeat"','"Target vote queued for "+p.Name+"; separate target repeat setting controls sequence; server decides removal"')
        p.write_text(s)
        p=root/'ClientFeatures.cs';s=p.read_text()
        s=once(s,'    private static bool _cycleAllTargets, _cycleForceThree;','    private static bool _cycleAllTargets, _cycleForceThree, _cycleAutoTarget;')
        s=once(s,'        if (commandType != "vote-kick" && commandType != "vote-kick-loop") return;', '''        bool autoTarget = commandType == "vote-target-auto";
                if (!autoTarget && commandType != "vote-kick" && commandType != "vote-kick-loop") return;
                if (autoTarget && !ReadSetting("RaidTargetAutoVote")) { Status("vote-ignored", "Target auto vote is OFF"); return; }''')
        s=once(s,'            if (commandType == "vote-kick-loop" && ReadSetting("VoteRejoinThree"))','''            bool repeat = autoTarget ? ReadSetting("RaidTargetVoteRepeat") :
                        commandType == "vote-kick-loop" && ReadSetting("VoteRejoinThree");
                    if (repeat)''')
        s=once(s,'                    _cycleRoundLimit = ReadSetting("VoteRejoinFour") ? 4 : 3;', '''                    _cycleAutoTarget = autoTarget;
                            _cycleRoundLimit = ReadSetting(autoTarget ? "RaidTargetVoteFour" : "VoteRejoinFour") ? 4 : 3;''')
        s=once(s,'        _cycleForceThree=true;','        _cycleForceThree=true;\n        _cycleAutoTarget=false;')
        s=once(s,'        _cycleForceThree = false;','        _cycleForceThree = false;\n        _cycleAutoTarget = false;')
        s=once(s,'        if (!_cycleForceThree && !ReadSetting("VoteRejoinThree")) { CancelVoteCycle("Toggle switched off"); return; }','''        if (_cycleAutoTarget)
                {
                    if (!ReadSetting("RaidTargetAutoVote") || !ReadSetting("RaidTargetVoteRepeat"))
                    { CancelVoteCycle("Target vote repeat switched off"); return; }
                }
                else if (!_cycleForceThree && !ReadSetting("VoteRejoinThree")) { CancelVoteCycle("Toggle switched off"); return; }''')
        p.write_text(s)
        s=ui.read_text()
        a='        rounds.setOnCheckedChangeListener((group,id)->set(a,voteSettings,"VoteRejoinFour",id==four.getId()));'
        s=once(s,a,a+'''
                title(a,p,"Target vote-kick sequence","Separate from the individual vote sequence. The existing target auto-vote setting must be ON. Repeat OFF leaves one normal vote.");
                check(a,p,"Repeat target vote-kick","OFF by default. Turning this off stops the target sequence.",voteSettings,"RaidTargetVoteRepeat",false);
                android.widget.RadioGroup targetRounds=new android.widget.RadioGroup(a);
                targetRounds.setOrientation(LinearLayout.HORIZONTAL);
                android.widget.RadioButton targetThree=new android.widget.RadioButton(a),targetFour=new android.widget.RadioButton(a);
                targetThree.setId(View.generateViewId());targetFour.setId(View.generateViewId());
                targetThree.setText("3 target rounds");targetFour.setText("4 target rounds");
                targetThree.setTextColor(FG);targetFour.setTextColor(FG);
                targetRounds.addView(targetThree);targetRounds.addView(targetFour);p.addView(targetRounds,new LinearLayout.LayoutParams(-1,-2));
                targetRounds.check(enabled(a,voteSettings,"RaidTargetVoteFour",false)?targetFour.getId():targetThree.getId());
                targetRounds.setOnCheckedChangeListener((group,id)->set(a,voteSettings,"RaidTargetVoteFour",id==targetFour.getId()));
        ''')
        ui.write_text(s)
        print('Target vote controls independently wired')

        PY_TARGET
    - name: Run compiled whitelist tests and vote limit wiring checks
      shell: bash
      run: |-
        set -e
        T=$(mktemp -d)
        dotnet new console --framework net10.0 --output "$T" --no-restore
        cp LobbyGuardian/Plugin/ModerationRules.cs "$T/ModerationRules.cs"
        cat > "$T/Program.cs" <<'CS'
        using System;
        using LobbyGuardian;
        static void Check(bool value,string label){if(!value)throw new Exception(label); Console.WriteLine("PASS "+label);}
        var r=new RuleSettings();
        r.AllowFriendCodes.Add("friend#1234"); r.AllowPuids.Add("allowed-puid"); r.AllowNamesExact.Add("Trusted");
        r.AutoBanEnabled=true; r.BanFriendCodes.Add("blocked#0000");
        var p=new PlayerIdentity {ClientId=9,FriendCode="blocked#0000",Puid="other-puid",Name="Guest"};
        Check(ModerationRules.OnJoin(r,p,true).Action==ModerationAction.Ban,"original ban list still works");
        Check(ModerationRules.WhitelistOnlyKick(r,p,true).Action==ModerationAction.Kick,"new admission rule never bans");
        Check(ModerationRules.WhitelistOnlyKick(r,p,false).Action==ModerationAction.Allow,"non-host no action");
        p.IsLocal=true;Check(ModerationRules.WhitelistOnlyKick(r,p,true).Action==ModerationAction.Allow,"self excluded");p.IsLocal=false;
        p.IsHost=true;Check(ModerationRules.WhitelistOnlyKick(r,p,true).Action==ModerationAction.Allow,"host excluded");p.IsHost=false;
        p.FriendCode=" FRIEND#1234 ";Check(ModerationRules.WhitelistOnlyKick(r,p,true).Action==ModerationAction.Allow,"friend code whitelist");
        p.FriendCode="blocked#0000";p.Puid="allowed-puid";Check(ModerationRules.WhitelistOnlyKick(r,p,true).Action==ModerationAction.Allow,"PUID whitelist");
        p.Puid="other-puid";p.Name="trusted";Check(ModerationRules.WhitelistOnlyKick(r,p,true).Action==ModerationAction.Allow,"name whitelist");
        p.Name="Guest";p.FriendCode="";Check(ModerationRules.WhitelistOnlyKick(r,p,true).Action==ModerationAction.Allow,"unresolved friend code deferred");
        p.FriendCode="blocked#0000";p.Puid="";Check(ModerationRules.WhitelistOnlyKick(r,p,true).Action==ModerationAction.Allow,"unresolved PUID deferred");
        r.AutoBanEnabled=false;p.Puid="other-puid";Check(ModerationRules.OnJoin(r,p,true).Action==ModerationAction.Allow,"original ban OFF honored");
        CS
        dotnet run --project "$T" --configuration Release
        python3 - <<'PY'
        from pathlib import Path
        s=Path('LobbyGuardian/Plugin/ClientFeatures.cs').read_text()
        assert '_cycleRoundLimit = ReadSetting(autoTarget ? "RaidTargetVoteFour" : "VoteRejoinFour") ? 4 : 3;' in s
        assert 'if (!ReadSetting("RaidTargetAutoVote") || !ReadSetting("RaidTargetVoteRepeat"))' in s
        assert 'bool repeat = autoTarget ? ReadSetting("RaidTargetVoteRepeat")' in s
        assert 'type="vote-target-auto"' in Path("LobbyGuardian/Plugin/LobbyRaidGuard.cs").read_text()
        assert '_cycleJoinRequests >= _cycleRoundLimit - 1' in s
        assert s.count('if (_cycleVotes >= _cycleRoundLimit)')==2
        assert 'if (_lastExitRestricted) { CancelVoteCycle("Server kick/ban reported; no retry"); return; }' in s
        assert '_cycleRoundLimit=3;' in s
        for limit in (3,4):
            assert limit-1 in (2,3)
        print('Vote limit wiring checks passed (not network tests)')
        PY
    - name: Compile final plugin
      run: dotnet build LobbyGuardian/LobbyGuardian.Plugin.csproj --configuration Release --no-restore --no-incremental
    - name: Package compiled plugin
      shell: bash
      run: |-
        python3 - <<'PY'
        from pathlib import Path
        import zipfile,hashlib
        asset=Path('fusionApp/src/main/assets/BepInEx-arm64.zip')
        dll=Path('LobbyGuardian/bin/Release/net10.0/LobbyGuardian.Plugin.dll').read_bytes()
        for marker in (b'WhitelistOnlyKick',b'SweepWhitelistOnly',b'_cycleRoundLimit'):
            assert marker in dll,marker
        for marker in ('KickEveryoneExceptWhitelist','VoteRejoinFour'):
            assert marker.encode('utf-16le') in dll,marker
        with zipfile.ZipFile(asset) as old, zipfile.ZipFile(asset.with_suffix('.new.zip'),'w',compression=zipfile.ZIP_DEFLATED) as new:
            for item in old.infolist():
                if item.filename.rsplit('/',1)[-1].lower()=='lobbyguardian.plugin.dll':continue
                new.writestr(item,old.read(item))
            new.writestr('plugins/LobbyGuardian.Plugin.dll',dll)
        asset.with_suffix('.new.zip').replace(asset)
        print('Final plugin SHA256:',hashlib.sha256(dll).hexdigest())
        PY
    - name: Build Android APK
      run: |-
        chmod +x gradlew
        ./gradlew :fusionApp:assembleDebug --stacktrace
    - name: Verify APK contains final runtime and menu
      shell: bash
      run: |-
        python3 - <<'PY'
        from pathlib import Path
        import io,zipfile,hashlib
        expected=Path('LobbyGuardian/bin/Release/net10.0/LobbyGuardian.Plugin.dll').read_bytes()
        apks=list(Path('fusionApp/build/outputs/apk/debug').glob('*.apk'))
        assert apks,'APK not built'
        for apk in apks:
            with zipfile.ZipFile(apk) as a:
                with zipfile.ZipFile(io.BytesIO(a.read('assets/BepInEx-arm64.zip'))) as z:
                    matches=[n for n in z.namelist() if n.rsplit('/',1)[-1].lower()=='lobbyguardian.plugin.dll']
                    assert matches==['plugins/LobbyGuardian.Plugin.dll'],matches
                    assert z.read(matches[0])==expected,'Stale DLL in APK'
                dex=b''.join(a.read(n) for n in a.namelist() if n.endswith('.dex'))
                for marker in (b'KickEveryoneExceptWhitelist',b'VoteRejoinFour',b'Auto-kick everyone except whitelist',b'3 rounds',b'4 rounds',b'RaidTargetVoteRepeat',b'RaidTargetVoteFour',b'3 target rounds',b'4 target rounds'):
                    assert marker in dex,marker
            print(apk.name, 'verified packaged DLL:',hashlib.sha256(expected).hexdigest())
        PY
    - name: Upload verified packaging candidate
      uses: actions/upload-artifact@v4
      with:
        name: LobbyGuardian-v4.3.47b-Android-WhitelistKick-VoteRounds
        path: fusionApp/build/outputs/apk/debug/*.apk
        if-no-files-found: error
    - name: Upload final sources
      uses: actions/upload-artifact@v4
      with:
        name: LobbyGuardian-v4.3.47b-Sources
        path: |-
          LobbyGuardian/Plugin/*.cs
          fusionApp/src/main/java/dev/allofus/fusioncore/GuardianUnifiedExtras.java
          LobbyGuardian/bin/Release/net10.0/LobbyGuardian.Plugin.dll
        if-no-files-found: error
