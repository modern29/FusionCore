name: Lobby Guardian v4.3.96 - No FPS and Native Host Start
'on':
  push:
    paths:
    - .github/workflows/lobbyguardian-v4396-native-start.yml
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
    - uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    - uses: gradle/actions/setup-gradle@v4
    - run: python3 -m pip install --user PyYAML
    - name: Rebuild without frame monitoring
      shell: bash
      run: "python3 - <<'PY_4395'\nfrom pathlib import Path\nimport yaml, subprocess, tempfile, ast\nsource=Path('.github/workflows/lobbyguardian-v4394-role-colors.yml')\nsteps=yaml.safe_load(source.read_text())['jobs']['android']['steps']\nrun=next(s['run'] for s in steps if s.get('name')=='Rebuild Lite Performance and role label colors')\nneedle='\\nexecute(script)\\n'\nassert run.count(needle)==1\nrepair='from pathlib import Path\\n\\ndef edit(path, old, new):\\n    p=Path(path); s=p.read_text(encoding=\\'utf8\\')\\n    assert s.count(old)==1, (path,old,s.count(old))\\n    p.write_text(s.replace(old,new,1),encoding=\\'utf8\\')\\n\\nplugin=Path(\\'LobbyGuardian/Plugin\\')\\np=plugin/\\'FrameHealth.cs\\'\\ns=p.read_text(encoding=\\'utf8\\')\\n# Preserve the original chat/intro guard only, without frame sampling or writes.\\nassert s.count(\\'    private const int TargetFps=30;\\')==1\\ns=s.split(\\'    private const int TargetFps=30;\\',1)[0]+\\'}\\\\n\\'\\ns=s.replace(\\'internal static class FrameHealth\\',\\'internal static class MatchTransitionGuard\\')\\ns=s.replace(\\'// Read-only Unity frame counter and local input-transition diagnostics.\\',\\'// Protect native chat during the match introduction; no FPS monitoring.\\')\\ns=s.replace(\\'    private static Type? _timeType,_playerType,_introType;\\',\\'    private static Type? _introType;\\')\\ns=s.replace(\\'    private static long _sampleAt,_phaseAt,_startAt;\\',\\'    private static long _phaseAt,_startAt;\\')\\nfor line in (\\'    private static int? _lastFrame;\\\\n\\',\\'    private static int _updates;\\\\n\\',\\'    private static double _totalMs,_maxMs;\\\\n\\'):\\n    assert s.count(line)==1;s=s.replace(line,\\'\\')\\nfor line in (\\'using System.IO;\\\\n\\',\\'using System.Text.Json;\\\\n\\',\\'using BepInEx;\\\\n\\'):\\n    s=s.replace(line,\\'\\')\\n# Keep phase observation only when the chat feature is used; retain an\\n# explicit reset on room changes to avoid stale match-intro state.\\nneedle=\\'    internal static bool ChatUiReady(){\\'\\nassert s.count(needle)==1\\ns=s.replace(needle,\\'    internal static void Reset(){_phaseAt=0;_startAt=0;_started=false;_state=\"\";}\\\\n\\'+needle)\\np.write_text(s,encoding=\\'utf8\\')\\np.rename(plugin/\\'MatchTransitionGuard.cs\\')\\ncore=plugin/\\'LobbyGuardianPlugin.cs\\'\\nedit(core,\\'        long started=FrameHealth.Begin();\\\\n        try{\\\\n\\',\\'\\')\\nedit(core,\\'        }finally{FrameHealth.End(started);}\\\\n\\',\\'\\')\\nedit(core,\\'    private static void ClientGameJoinedPostfix() => ClientFeatures.OnGameJoined();\\',\\'    private static void ClientGameJoinedPostfix() { MatchTransitionGuard.Reset(); ClientFeatures.OnGameJoined(); }\\')\\nedit(core,\\'    private static void ClientDisconnectedPostfix() {\\',\\'    private static void ClientDisconnectedPostfix() {\\\\n        MatchTransitionGuard.Reset();\\')\\n# Keep all incoming RPC checks immediate. Only periodic maintenance is gated.\\nedit(core,\\'    private static long _nextSafetyMaintenance,_nextConnectionMaintenance;\\',\\'    private static long _nextSafetyMaintenance,_nextConnectionMaintenance,_nextRpcMaintenance;\\')\\nedit(core,\\'            HostResilienceShield.Tick(); BotShield.Tick(); RpcAutoBanGuard.Tick();\\',\\'            HostResilienceShield.Tick(); BotShield.Tick();\\\\n            if(now>=_nextRpcMaintenance){_nextRpcMaintenance=now+250;RpcAutoBanGuard.Tick();}\\')\\nutil=plugin/\\'UtilityFull.cs\\'\\ns=util.read_text(encoding=\\'utf8\\');assert s.count(\\'FrameHealth.ChatUiReady()\\')==2\\nutil.write_text(s.replace(\\'FrameHealth.ChatUiReady()\\',\\'MatchTransitionGuard.ChatUiReady()\\'),encoding=\\'utf8\\')\\n# Preserve native/server eligibility and host checks; remove only the mod gate.\\nedit(util,\\'        // Native game rule is authoritative; use the actual connected client list, not dummy decorations.\\\\n        int players=GameBridge.ReadConnectedPlayers().Where(p=>p.ClientId>=0).Select(p=>p.ClientId).Distinct().Count();\\\\n        int minimum=4;\\\\n        if(int.TryParse(Get(manager,\"MinPlayers\",\"minPlayers\",\"MinimumPlayers\")?.ToString(),out int nativeMin)&&nativeMin>=4&&nativeMin<=15)minimum=nativeMin;\\\\n        if(players<minimum){StartActionStatus(r,\"too-few-players\",$\"Connected players: {players}; required: {minimum}\");return;}\\\\n\\',\\'        // Request the native host action without imposing a separate mod player-count rule.\\\\n\\')\\n# Publish a start-specific pregame state; do not depend on the player list\\n# or the general-purpose lobby-visual detector for start eligibility.\\nclient=plugin/\\'ClientFeatures.cs\\'\\nedit(client,\\'            lobby = IsLobby(), host = GameBridge.IsHost(), gameId, atUtc = DateTimeOffset.UtcNow.ToString(\"O\"), players\\',\\'\\'\\'            lobby = IsLobby(), host = GameBridge.IsHost(), gameId,\\n            startEligible = GameBridge.IsHost() && gameId!=0 && gameId!=-1 && (Get(GameBridge.Client,\"GameState\")?.ToString() is \"Joined\" or \"Lobby\" or \"1\"),\\n            atUtc = DateTimeOffset.UtcNow.ToString(\"O\"), players\\'\\'\\')\\n# Diagnostics unrelated to controls need not rewrite every few seconds.\\nbadges=plugin/\\'LobbyNameBadges.cs\\'\\ns=badges.read_text(encoding=\\'utf8\\');assert s.count(\\'_nextBadgeStatus=now.AddSeconds(3);\\')==2\\nbadges.write_text(s.replace(\\'_nextBadgeStatus=now.AddSeconds(3);\\',\\'_nextBadgeStatus=now.AddSeconds(15);\\'),encoding=\\'utf8\\')\\nui=Path(\\'fusionApp/src/main/java/dev/allofus/fusioncore/LobbyGuardianOverlay.java\\')\\nedit(ui,\\'            bubble.setText(\"LG\\\\\\\\n-- FPS\");\\',\\'            bubble.setText(\"LG\");\\')\\nedit(ui,\\'bubble.setTextSize(9);bubble.setGravity(Gravity.CENTER);bubble.setSingleLine(false);bubble.setMaxLines(2);\\',\\'bubble.setTextSize(12);bubble.setGravity(Gravity.CENTER);bubble.setSingleLine(true);bubble.setMaxLines(1);\\')\\nedit(ui,\\'            watchFrameRate(activity,bubble);\\\\n\\',\\'\\')\\ns=ui.read_text(encoding=\\'utf8\\'); a=s.index(\\'    private static JSONObject freshFrameHealth()\\');b=s.index(\\'    private static final java.util.WeakHashMap<Activity,java.util.ArrayDeque<String>> ALERT_QUEUE\\',a)\\ns=s[:a]+s[b:];ui.write_text(s,encoding=\\'utf8\\')\\nedit(ui,\\'            actionButton(activity,account,\"FPS & Performance\",v->showFrameHealth(activity));\\\\n\\',\\'\\')\\nedit(ui,\\'j.optBoolean(\"host\")&&j.optBoolean(\"lobby\")&&j.optInt(\"gameId\",0)!=0\\',\\'j.optBoolean(\"host\")&&j.optBoolean(\"startEligible\",j.optBoolean(\"lobby\"))&&j.optInt(\"gameId\",0)!=0\\')\\nedit(ui,\\'!room.optBoolean(\"host\")||!room.optBoolean(\"lobby\")||id==0\\',\\'!room.optBoolean(\"host\")||!room.optBoolean(\"startEligible\",room.optBoolean(\"lobby\"))||id==0\\')\\nedit(ui,\\'Normal host start. Game requirements still apply.\\',\\'Normal host start. Public and private requests use native game/server rules.\\')\\nedit(ui,\\'version.setText(\"v4.3.94\");\\',\\'version.setText(\"v4.3.96\");\\')\\nassert not any(\\'FrameHealth.\\' in f.read_text(encoding=\\'utf8\\') for f in plugin.glob(\\'*.cs\\'))\\nassert \\'FPS\\' not in ui.read_text(encoding=\\'utf8\\')\\nassert not (plugin/\\'FrameHealth.cs\\').exists()\\nprint(\\'Removed FPS telemetry and overlay; preserved match-transition guard and native host start checks\\')\\n'\nbase_line=\"base=yaml.safe_load(Path('.github/workflows/lobbyguardian-v4382-fps-match-transition.yml').read_text())['jobs']['android']['steps']\"\nextra_checks=\"\\nfor step in base:\\n    if step.get('name')=='Compile final patched plugin and verify embedded binary':\\n        step['run']=step['run'].replace('LobbyGuardian-frame-health.json','LobbyGuardian-start-action-result.json')\\n\"\ninjection='old=old.replace('+repr(base_line)+','+repr(base_line+extra_checks)+',1)\\ninsert += '+repr(repair+'\\n')+'\\n'\n# Existing 4394 run has already applied its nested script transformations here.\nouter_add = 'anchor=\"script=old.replace(marker,insert+marker,1)\"\\nassert script.count(anchor)==1\\nscript=script.replace(anchor,'+repr(injection)+'+anchor,1)\\n'\n# Replace the expected *compiled* FPS marker in the inner validation, after\n# the 4394 nested replacement has run. Keep every patch context unchanged.\nold_tuple=\"('Native pacing (no mod override)',\"\nnew_tuple=\"('LobbyGuardian-start-action-result.json',\"\n# In the middle script the tuple is itself a string literal used for replacement.\nouter_add += 'assert script.count('+repr(old_tuple)+')==1\\nscript=script.replace('+repr(old_tuple)+','+repr(new_tuple)+',1)\\n'\nrun=run.replace(needle,'\\n'+outer_add+'execute(script)\\n',1)\nrun=run.replace(\".replace('30 FPS target applied','Native pacing (no mod override)')\", \".replace('30 FPS target applied','LobbyGuardian-start-action-result.json')\",1)\nwith tempfile.TemporaryDirectory() as tmp:\n    p=Path(tmp)/'rebuild.sh';p.write_text(run,encoding='utf8')\n    subprocess.run(['bash','-n',str(p)],check=True)\n    subprocess.run(['bash','-eo','pipefail',str(p)],check=True)\nPY_4395\n"
    - name: Verify no frame monitor and exact APK plugin
      shell: bash
      run: "python3 - <<'PY_VERIFY'\nfrom pathlib import Path\nimport io,zipfile\np=Path('LobbyGuardian/bin/Release/net10.0/LobbyGuardian.Plugin.dll');dll=p.read_bytes()\nfor token in ('LobbyGuardian-frame-health.json','get_targetFrameRate','set_targetFrameRate'):\n    assert token.encode('utf-16le') not in dll,token\nfor token in ('#FF4545','LobbyGuardian-start-action-result.json','startEligible'):\n    assert token.encode('utf-16le') in dll,token\napks=list(Path('fusionApp/build/outputs/apk/debug').glob('*.apk'));assert apks\nfor apk in apks:\n    with zipfile.ZipFile(apk) as z,zipfile.ZipFile(io.BytesIO(z.read('assets/BepInEx-arm64.zip'))) as b:\n        n=[x for x in b.namelist() if x.endswith('plugins/LobbyGuardian.Plugin.dll')];assert len(n)==1 and b.read(n[0])==dll\nprint('Verified no FPS telemetry and matching compiled APK plugin')\nPY_VERIFY\n"
    - uses: actions/upload-artifact@v4
      with:
        name: LobbyGuardian-v4.3.96-Android-NoFPS
        path: fusionApp/build/outputs/apk/debug/*.apk
        if-no-files-found: error
    - uses: actions/upload-artifact@v4
      with:
        name: LobbyGuardian-v4.3.96-Sources-Diagnostics
        path: 'LobbyGuardian/Plugin/*.cs

          fusionApp/src/main/java/dev/allofus/fusioncore/LobbyGuardianOverlay.java

          '
        if-no-files-found: error
