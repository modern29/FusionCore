      run: "python3 - <<'PY_VERIFY'\nfrom pathlib import Path\nimport io,zipfile\np=Path('LobbyGuardian/bin/Release/net10.0/LobbyGuardian.Plugin.dll');dll=p.read_bytes()\n\
        for token in ('LobbyGuardian-frame-health.json','get_targetFrameRate','set_targetFrameRate','startEligible'):\n  \
        \  assert token.encode('utf-16le') not in dll,token\nfor token in ('#FF4545','LobbyGuardian-start-action-result.json','color:red','/k\
        \ red','/rolerate Engineer 1 100'):\n    assert token.encode('utf-16le') in dll,token\napks=list(Path('fusionApp/build/outputs/apk/debug').glob('*.apk'));assert\
        \ apks\nfor apk in apks:\n    with zipfile.ZipFile(apk) as z,zipfile.ZipFile(io.BytesIO(z.read('assets/BepInEx-arm64.zip')))\
        \ as b:\n        n=[x for x in b.namelist() if x.endswith('plugins/LobbyGuardian.Plugin.dll')];assert len(n)==1 and\
        \ b.read(n[0])==dll\nprint('Verified no FPS telemetry and matching compiled APK plugin')\nPY_VERIFY\n\npython3 - <<'PY'\n\
        from pathlib import Path\nb=Path(\"LobbyGuardian/bin/Release/net10.0/LobbyGuardian.Plugin.dll\").read_bytes()\nfor\
        \ marker in (\"/info\",\"/color\",\"Native color request unavailable.\"):\n    assert marker.encode(\"utf-16le\")\
        \ in b, marker\nPY\n\npython3 - <<'PY_NO_FX'\nfrom pathlib import Path\nplugin=Path('LobbyGuardian/Plugin')\nui=Path('fusionApp/src/main/java/dev/allofus/fusioncore/LobbyGuardianOverlay.java').read_text()\n\
        b=Path('LobbyGuardian/bin/Release/net10.0/LobbyGuardian.Plugin.dll').read_bytes()\nassert not (plugin/'LobbyCosmeticFx.cs').exists()\n\
        for token in ('LobbyGuardian-cosmetic-fx-command.json','Appearance FX: ','Color preview: ','Skin preview','Look preview:\
        \ '):\n    assert token.encode('utf-16le') not in b, token\nfor token in ('Lookalike Formation (LG FX)','appearanceFxMenu','cosmeticFxMenu','Cosmetic\
        \ Elimination','Reset Appearance / Replicas','Everyone’s Look',\"Everyone's Look\"):\n    assert token not in ui,\
        \ token\nprint('LG-only cosmetic effects absent; earlier APK verification retained')\nPY_NO_FX\n\npython3 - <<'PY_4409'\n\
        from pathlib import Path\nroot=Path('fusionApp/src/main/java/dev/allofus/fusioncore')\nassert not any('Show host Start\
        \ button' in p.read_text(encoding='utf8') for p in root.rglob('*.java'))\ns=Path('LobbyGuardian/Plugin/LobbyAppearance.cs').read_text()\n\
        assert 'SharedCloneLimit=20' in s and '_sharedNext=now.AddMilliseconds(750)' in s\nassert 'SharedTextPoints' in s\
        \ and 'SharedShapePoint' in s\nPY_4409\n\npython3 - <<'PY_4410'\nfrom pathlib import Path\np=Path('LobbyGuardian/Plugin')\n\
        s=(p/'LobbyAppearance.cs').read_text()\nassert '_sharedPrivateOnly' not in s and 'New shapes and text require a private'\
        \ not in s\nassert 'SharedCloneLimit=20' in s and '_sharedNext=now.AddMilliseconds(750)' in s\nassert 'if(!GameBridge.IsHost())return\
        \ \"You must be the host\"' in s\nfor f in ('HostLobbyClose.cs','LobbyChatCommands.cs'):\n    assert 'if(!ChatModerators.PrivateRoom())'\
        \ not in (p/f).read_text()\nassert 'if((permission==\"AllowLobbyLayout\"||permission==\"AllowSharedClones\")&&!PrivateRoom())return\
        \ false;' in (p/'ChatModerators.cs').read_text()\nPY_4410\n"
    - uses: actions/upload-artifact@v4
      with:
        name: LobbyGuardian-v4.4.10-Android-Baseline
        path: fusionApp/build/outputs/apk/debug/*.apk
        if-no-files-found: error
