        java-version: '17'
    - uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    - uses: gradle/actions/setup-gradle@v4
    - name: Install PyYAML
      run: python3 -m pip install --user PyYAML
