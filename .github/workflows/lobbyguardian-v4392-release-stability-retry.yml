    - name: Verify new command handlers in final compiled plugin
      shell: bash
      run: |
        python3 - <<'PY_VERIFY_4391'
        from pathlib import Path
        import io, zipfile
        expected=Path('LobbyGuardian/bin/Release/net10.0/LobbyGuardian.Plugin.dll').read_bytes()
        for token in ('extra-tasks','extra-immortal','extra-spin','extra-drone','extra-spectate','extra-scan','extra-teleport','extra-native-invisibility','extra-shuffle-color','extra-shuffle-look'):
            assert token.encode('utf-16le') in expected, token
        apks=list(Path('fusionApp/build/outputs/apk/debug').glob('*.apk'))
        assert apks, 'APK not produced'
        for apk in apks:
            with zipfile.ZipFile(apk) as z, zipfile.ZipFile(io.BytesIO(z.read('assets/BepInEx-arm64.zip'))) as b:
                names=[n for n in b.namelist() if n.endswith('plugins/LobbyGuardian.Plugin.dll')]
                assert len(names)==1 and b.read(names[0])==expected
        print('New command handlers and packaged binary verified')
        PY_VERIFY_4391
    - name: Verify Start result protocol in compiled plugin
      shell: bash
      run: |
        python3 - <<'PY_VERIFY_4392'
        from pathlib import Path
        p=Path('LobbyGuardian/bin/Release/net10.0/LobbyGuardian.Plugin.dll')
        blob=p.read_bytes()
        for token in ('LobbyGuardian-start-action-result.json','requestId','30 FPS target applied'):
            assert token.encode('utf-16le') in blob, token
        print('Verified compiled Start result and FPS target markers')
        PY_VERIFY_4392
    - name: Upload v4.3.92 Android APK
      uses: actions/upload-artifact@v4
      with:
        name: LobbyGuardian-v4.3.92-Android-PracticeAppearance
        path: fusionApp/build/outputs/apk/debug/*.apk
        if-no-files-found: error
    - name: Upload v4.3.92 source diagnostics
      uses: actions/upload-artifact@v4
      with:
        name: LobbyGuardian-v4.3.92-Sources-Diagnostics
        path: |
          LobbyGuardian/Plugin/*.cs
          fusionApp/src/main/java/dev/allofus/fusioncore/LobbyGuardianOverlay.java
          fusionApp/src/main/java/dev/allofus/fusioncore/GuardianUnifiedExtras.java
          fusionApp/src/main/java/dev/allofus/fusioncore/GuardianFavorites.java
          fusionApp/src/main/java/dev/allofus/fusioncore/LobbyGuardianToolbox.java
        if-no-files-found: error
