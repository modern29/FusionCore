# Build fix based on v4.3.3 failure: CS0103 missing ComponentsAll in LobbyAppearance.cs.
# All existing gameplay feature patches retained; restores original v4.2.8 helper.
name: Lobby Guardian v4.3.4 - Fix Clone Compile + Preserve DM Roles
'on':
  push:
    paths:
    - .github/workflows/lobbyguardian-v434-fixed-compile.yml
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
    - name: Checkout FusionCore
      uses: actions/checkout@v4
    - name: Java 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
    - name: .NET 10
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    - name: Gradle
      uses: gradle/actions/setup-gradle@v4
    - name: Install PyYAML
      run: python3 -m pip install --user PyYAML
    - name: Restore source and apply twins, lobby, chat, roles + C# compilation fix
      shell: bash
      run: |-
        python3 - <<'PYTHON'
        import base64, pathlib, subprocess, urllib.request, zlib
        import yaml
        sha='6805109d676d2c021cc30aa635b4501fc147f6d3'
        url=('https://raw.githubusercontent.com/modern29/FusionCore/' + sha +
            '/.github/workflows/lobbyguardian-v428-optional-alert-assertion-fix.yml')
        with urllib.request.urlopen(url,timeout=60) as response:
            original=yaml.safe_load(response.read().decode('utf-8'))
        steps=original['jobs']['build']['steps']
        assert sum(s.get('name')=='Build Lobby Guardian plugin candidate' for s in steps)==1
        assert sum(s.get('name')=='Build custom Android FusionCore debug APK' for s in steps)==1
        patches=[
            zlib.decompress(base64.b64decode('')).decode('utf-8'),
            zlib.decompress(base64.b64decode('')).decode('utf-8')
        ]
        patched=False
        count=0
        for step in steps:
            label=step.get('name','')
            if label=='Build Lobby Guardian plugin candidate':
                for idx,patch in enumerate(patches,1):
                    patch_path=pathlib.Path('/tmp/lg_patch_'+str(idx)+'.py')
                    patch_path.write_text(patch,encoding='utf-8')
                    subprocess.run(['python3',str(patch_path)],check=True)
                # v4.3.4: Restore a helper mistakenly removed by v4.3.2's
                # cosmetics-only block replacement. Unmodified helper from v4.2.8.
                visual_path=pathlib.Path('LobbyGuardian/Plugin/LobbyAppearance.cs')
                visual_source=visual_path.read_text(encoding='utf-8')
                marker='    // Make a real-looking LOCAL visual duplicate of the cosmetics hierarchy.'
                if visual_source.count(marker)!=1:
                    raise RuntimeError('v4.3.4: expected visual clone insertion point missing')
                if 'private static IEnumerable<object> ComponentsAll(' in visual_source:
                    raise RuntimeError('v4.3.4: ComponentsAll already defined; verify source baseline')
                original_helper='    private static IEnumerable<object> ComponentsAll(object gameObject,Type t)\n    {\n        var results=new List<object>();\n        foreach(var m in gameObject.GetType().GetMethods(F).Where(x=>x.Name=="GetComponentsInChildren")){\n            try{\n                MethodInfo call=m;\n                object? result=null;\n                if(m.IsGenericMethodDefinition&&m.GetGenericArguments().Length==1){\n                    call=m.MakeGenericMethod(t);\n                    if(m.GetParameters().Length==1)result=call.Invoke(gameObject,new object[]{true});\n                    else if(m.GetParameters().Length==0)result=call.Invoke(gameObject,null);\n                }else if(m.GetParameters().Length==2){\n                    var a=m.GetParameters()[0].ParameterType==typeof(Type)?t:Il2CppTypeArg(m.GetParameters()[0].ParameterType,t);\n                    if(a is not null)result=m.Invoke(gameObject,new object[]{a,true});\n                }\n                if(result is IEnumerable items&&result is not string){\n                    foreach(var it in items)if(it is not null)results.Add(it);\n                    if(results.Count>0)break;\n                }\n            }catch{}\n        }\n        return results;\n    }\n'
                visual_source=visual_source.replace(marker,original_helper+'\n'+marker,1)
                visual_path.write_text(visual_source,encoding='utf-8')
                assert visual_source.count('private static IEnumerable<object> ComponentsAll(')==1
                print('v4.3.4: repaired missing ComponentsAll helper before C# compilation',flush=True)
                patched=True
            if label=='Build custom Android FusionCore debug APK':
                break
            cmd=step.get('run')
            if cmd is None:continue
            print('::group::v4.2.8 inherited: '+label,flush=True)
            subprocess.run(['bash','-e','-o','pipefail','-c',cmd],check=True)
            print('::endgroup::',flush=True)
            count+=1
        if not patched or count<35:raise RuntimeError('Original source feature steps incomplete: '+str(count))
        print('All existing features preserved, v4.3.2 and v4.3.3 patches applied',flush=True)
        PYTHON
    - name: Build Android APK
      run: |-
        chmod +x gradlew
        ./gradlew :fusionApp:assembleDebug --stacktrace
    - name: Upload Android APK
      uses: actions/upload-artifact@v4
      with:
        name: LobbyGuardian-v4.3.4-Android-Twins-DM-Roles
        path: fusionApp/build/outputs/apk/debug/*.apk
        if-no-files-found: error
    - name: Upload plugin source and diagnostics
      uses: actions/upload-artifact@v4
      with:
        name: LobbyGuardian-v4.3.4-Plugin-Sources
        path: |-
          LobbyGuardian/Plugin/*.cs
          LobbyGuardian/bin/Release/net10.0/LobbyGuardian.Plugin.dll
        if-no-files-found: error
