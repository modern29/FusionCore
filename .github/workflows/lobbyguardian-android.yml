          raw = base64.b64decode(payload, validate=True)
          expected = '0a9e4c4b0f7807c7cee91f064400a6957778550fe9c08c538364d1d1ef868fd9'
          assert hashlib.sha256(raw).hexdigest() == expected, 'Embedded source checksum mismatch'
          project = pathlib.Path('LobbyGuardian')
          project.mkdir(exist_ok=True)
          with zipfile.ZipFile(io.BytesIO(raw)) as z:
              for name in z.namelist():
                  out = (project / name).resolve()
                  assert out.is_relative_to(project.resolve()), 'Unexpected archive path'
                  out.parent.mkdir(parents=True, exist_ok=True)
                  out.write_bytes(z.read(name))
          src = pathlib.Path('fusionApp/src/main/assets/BepInEx-arm64.zip')
          refs = project / 'refs'
          refs.mkdir(exist_ok=True)
          with zipfile.ZipFile(src) as z:
              dlls = [name for name in z.namelist() if name.lower().endswith('.dll') and '/core/' in ('/' + name.lower())]
              print('FusionCore runtime DLLs found:', len(dlls))
              for name in dlls:
                  target = refs / pathlib.Path(name).name
                  target.write_bytes(z.read(name))
          required = ['BepInEx.Core.dll','BepInEx.Unity.IL2CPP.dll']
          missing = [name for name in required if not (refs/name).exists()]
          if missing:
              raise SystemExit(f'Missing FusionCore BepInEx assemblies: {missing}. Cannot build safely.')
          chosen = [p for p in sorted(refs.glob('*.dll')) if p.name.startswith((
              'BepInEx', 'Il2CppInterop', 'UnityEngine', 'Harmony', '0Harmony', 'MonoMod', 'Unhollower'
          ))]
          reference_xml = '\n'.join(
              '    <Reference Include="{}"><HintPath>refs/{}</HintPath><Private>false</Private></Reference>'.format(
              html.escape(p.stem, quote=True), html.escape(p.name, quote=True))
              for p in chosen
          )
          project_file = '''<Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <TargetFramework>net10.0</TargetFramework>
              <Nullable>enable</Nullable>
              <ImplicitUsings>enable</ImplicitUsings>
              <EnableDefaultCompileItems>false</EnableDefaultCompileItems>
              <AssemblyName>LobbyGuardian.Plugin</AssemblyName>
            </PropertyGroup>
            <ItemGroup>
              <Compile Include="Plugin/*.cs"/>
          __REFERENCES__
            </ItemGroup>
          </Project>'''.replace('__REFERENCES__',reference_xml)
          (project/'LobbyGuardian.Plugin.csproj').write_text(project_file)
          print('Selected compatible local references:', len(chosen))
          PYTHON
      - name: Build Lobby Guardian plugin candidate
        run: |
          dotnet restore LobbyGuardian/LobbyGuardian.Plugin.csproj --ignore-failed-sources
          dotnet build LobbyGuardian/LobbyGuardian.Plugin.csproj --configuration Release --no-restore
      - name: Bundle plugin in FusionCore BepInEx asset
        shell: bash
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          import os, zipfile
          src = Path('fusionApp/src/main/assets/BepInEx-arm64.zip')
          compiled = Path('LobbyGuardian/bin/Release/net10.0/LobbyGuardian.Plugin.dll')
          if not compiled.is_file():
              raise SystemExit('Plugin DLL missing: build did not succeed')
          tmp = src.with_suffix('.new.zip')
          with zipfile.ZipFile(src) as source, zipfile.ZipFile(tmp,'w') as dest:
              name = next((n for n in source.namelist() if n.endswith('core/BepInEx.Core.dll')), None)
              if name is None:
                  raise SystemExit('Unexpected BepInEx archive layout')
              prefix = name[:-len('core/BepInEx.Core.dll')]
              target = prefix + 'plugins/LobbyGuardian.Plugin.dll'
              for info in source.infolist():
                  if info.filename != target:
                      dest.writestr(info, source.read(info.filename))
              dest.write(compiled, target, compress_type=zipfile.ZIP_DEFLATED)
          os.replace(tmp, src)
          print('Bundled plugin at', target, 'in', src)
          PYTHON
      - name: Build custom Android FusionCore debug APK
        run: |
          chmod +x gradlew
          ./gradlew :fusionApp:assembleDebug --stacktrace
      - name: Upload experimental APK
        uses: actions/upload-artifact@v4
        with:
          name: LobbyGuardian-FusionCore-Android-EXPERIMENTAL
          path: fusionApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Upload plugin source and DLL
        uses: actions/upload-artifact@v4
        with:
          name: LobbyGuardian-Plugin-Diagnostics
          path: |
            LobbyGuardian/bin/Release/net10.0/LobbyGuardian.Plugin.dll
            LobbyGuardian/Plugin/*.cs
            LobbyGuardian/Docs/*.json
            LobbyGuardian/README.md
          if-no-files-found: warn

