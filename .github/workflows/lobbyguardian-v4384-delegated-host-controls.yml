name: Lobby Guardian v4.3.84 - Delegated host controls and 30 FPS
'on':
  push:
    paths:
    - .github/workflows/lobbyguardian-v4384-delegated-host-controls.yml
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
    - uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    - uses: gradle/actions/setup-gradle@v4
    - name: Install PyYAML
      run: python3 -m pip install --user PyYAML
    - name: Recreate v4.3.82, apply 30 FPS and delegated host controls
      shell: bash
      run: |
        python3 - <<'PY'
        from pathlib import Path
        import subprocess, tempfile, yaml
        source = Path('.github/workflows/lobbyguardian-v4382-fps-match-transition.yml')
        steps = yaml.safe_load(source.read_text())['jobs']['android']['steps']
        def run_step(name):
            matches = [s for s in steps if s.get('name') == name]
            assert len(matches) == 1 and 'run' in matches[0], name
            script = matches[0]['run']
            assert ('$'+'{{') not in script
            with tempfile.NamedTemporaryFile(mode='w', encoding='utf8', suffix='.sh', delete=False) as f:
                f.write(script)
                path = Path(f.name)
            try:
                subprocess.run(['bash', '-eo', 'pipefail', str(path)], check=True)
            finally:
                path.unlink(missing_ok=True)
        run_step('Recreate verified v4.3.81 source stages')
        run_step('Add FPS telemetry, reduce background polling and guard match transition')
        def replace_once(path, old, new):
            s = path.read_text(encoding='utf8')
            assert s.count(old) == 1, (str(path), old)
            path.write_text(s.replace(old,new,1), encoding='utf8')
        p = Path('LobbyGuardian/Plugin/FrameHealth.cs')
        replace_once(p, '    internal static long Begin(){', '''    private const int TargetFps=30;
            private static Type? _applicationType;
            private static PropertyInfo? _targetRateProperty;
            private static int? _effectiveTarget;
            private static string _targetStatus="pending";
            // Runs on the existing game update thread, at the existing one-second sample interval.
            // Do not alter physics, game time, input, or network update intervals.
            private static void ApplyTargetFps(){
                try{
                    _applicationType??=Find("UnityEngine.Application");
                    _targetRateProperty??=_applicationType?.GetProperty("targetFrameRate",BindingFlags.Public|BindingFlags.Static);
                    if(_targetRateProperty==null||!_targetRateProperty.CanWrite||!_targetRateProperty.CanRead){
                        _targetStatus="unavailable";_effectiveTarget=null;return;
                    }
                    if(_targetRateProperty.GetValue(null) is int existing && existing!=TargetFps)
                        _targetRateProperty.SetValue(null,TargetFps);
                    _effectiveTarget=_targetRateProperty.GetValue(null) is int value?value:null;
                    _targetStatus=_effectiveTarget==TargetFps?"30 FPS target applied":"target not accepted";
                }catch(Exception e){_effectiveTarget=null;_targetStatus=e.GetBaseException().GetType().Name;}
            }
            internal static long Begin(){''')
        replace_once(p, '                _timeType??=Find("UnityEngine.Time");', '                ApplyTargetFps();\n                _timeType??=Find("UnityEngine.Time");')
        replace_once(p, 'state=_state,canMove,atUtcMs=', 'state=_state,canMove,targetFps=TargetFps,effectiveTargetFps=_effectiveTarget,targetStatus=_targetStatus,atUtcMs=')
        java = Path('fusionApp/src/main/java/dev/allofus/fusioncore/LobbyGuardianOverlay.java')
        replace_once(java, 'version.setText("v4.3.82");', 'version.setText("v4.3.84");')
        replace_once(java, '"\\nGame update Hz: "+j.optString("updateHz")+', '"\\nTarget FPS: "+j.optString("targetFps","30")+"\\nApplied target: "+j.optString("effectiveTargetFps","Unavailable")+"\\nTarget status: "+j.optString("targetStatus","Unknown")+"\\nGame update Hz: "+j.optString("updateHz")+')
        patch = '--- a/LobbyGuardian/Plugin/ChatModerators.cs\n+++ b/LobbyGuardian/Plugin/ChatModerators.cs\n@@ -34,6 +34,90 @@\n     private static void Status(string stage,string message)\n     {try{File.WriteAllText(At("LobbyGuardian-moderator-status.json"),JsonSerializer.Serialize(new{\n         stage,message,atUtc=DateTimeOffset.UtcNow.ToString("O") }));}catch{}}\n+    // Delegated requests use the existing host-side action queues. A connected\n+    // identity and room must still be valid when the host consumes each request.\n+    private static string Room()=>Member(GameBridge.Client,"GameId")?.ToString()??"";\n+    private static bool Pregame()=>GameBridge.IsHost() && (Member(GameBridge.Client,"GameState")?.ToString() is "Joined" or "Lobby");\n+    private static bool PrivateRoom()=>Member(GameBridge.Client,"IsGamePublic") is bool pub && !pub;\n+    private static bool Enabled(JsonElement r,string name)=>r.TryGetProperty(name,out var v)&&v.ValueKind==JsonValueKind.True;\n+    private static bool Trusted(JsonElement r,string code)=>Enabled(r,"Enabled")&&r.TryGetProperty("FriendCodes",out var list)&&list.ValueKind==JsonValueKind.Array&&\n+        list.EnumerateArray().Any(x=>x.ValueKind==JsonValueKind.String&&string.Equals(x.GetString()?.Trim(),code,StringComparison.OrdinalIgnoreCase));\n+    private static bool Connected(int id,string code)=>id>=0&&GameBridge.ReadVotingRoster().Any(p=>p.ClientId==id&&!p.IsLocal&&!p.IsHost&&string.Equals(p.FriendCode?.Trim(),code,StringComparison.OrdinalIgnoreCase));\n+    internal static bool CheckDelegated(JsonElement r,string permission){\n+        if(!r.TryGetProperty("moderatorCode",out var code))return true; // existing local host UI\n+        try{\n+            if(!Pregame()||Room()==""||!r.TryGetProperty("gameId",out var room)||room.ToString()!=Room())return false;\n+            if(permission=="AllowLobbyLayout"&&!PrivateRoom())return false;\n+            if(!r.TryGetProperty("moderatorId",out var id)||!id.TryGetInt32(