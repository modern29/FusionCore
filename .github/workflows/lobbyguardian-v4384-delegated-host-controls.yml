            subprocess.run(['git','apply','--check',str(patch_path)],check=True)
            subprocess.run(['git','apply',str(patch_path)],check=True)
        finally:
            patch_path.unlink(missing_ok=True)
        run_step('Compile final patched plugin and verify embedded binary')
        dll = Path('LobbyGuardian/bin/Release/net10.0/LobbyGuardian.Plugin.dll').read_bytes()
        assert '30 FPS target applied'.encode('utf-16le') in dll, 'FPS target code absent from compiled plugin'
        assert 'AllowLobbyLayout'.encode('utf-16le') in dll and 'AllowSharedClones'.encode('utf-16le') in dll, 'Delegated controls missing'
        run_step('Build v4.3.82 Android APK')
        run_step('Verify final APK contains exact freshly built plugin')
        PY
