                            ("speed","PlayerSpeedMod",true,0.5,3,0.25),("crewVision","CrewLightMod",true,0.25,5,0.25),("impVision","ImpostorLightMod",true,0.25,5,0.25),("killCooldown","KillCooldown",true,10,60,2.5),("emergencyCooldown","EmergencyCooldown",false,0,60,5),("emergencyCount","NumEmergencyMeetings",false,0,9,1),("killDistance","KillDistance",false,0,2,1)}){
