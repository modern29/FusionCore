                            try{
                                string get=f.real?"GetFloat":"GetInt",set=f.real?"SetFloat":"SetInt";
                                var before=ReadOptions(o,get,f.field);
                                if(before==null){results.Add(new{key=f.key,status="unsupported-read"});continue;}
                                double prior=Convert.ToDouble(before,System.Globalization.CultureInfo.InvariantCulture);
                                if(Math.Abs(prior-number)<0.0001){results.Add(new{key=f.key,status="unchanged",value=prior});continue;}
