                        }
                        if(changed>0){try{var logic=Get(Singleton("GameManager"),"LogicOptions");var method=logic?.GetType().GetMethod("SetDirty",F,null,Type.EmptyTypes,null);if(method!=null){method.Invoke(logic,null);dirty=true;}}catch{}}
                    }
                }
