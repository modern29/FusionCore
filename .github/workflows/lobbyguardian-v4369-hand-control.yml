roles,"GetNumPerGame",role);var p=SimpleRoleRead(roles,"GetChancePerGame",role);result=c!=null&&p!=null&&Convert.ToInt32(c)==count&&Convert.ToInt32(p)==chance?"Role settings matched locally":"Role change not confirmed";}\n                            else result="Role setter unavailable";\n                        }else result="Role settings unavailable or invalid";\n                    }else{\n                        var f=SimpleHostFields.FirstOrDefault(x=>x.key==key);double v=r.GetProperty("value").GetDouble();\n                        if(f.key!=null&&double.IsFinite(v)&&v>=f.lo&&v<=f.hi&&Math.Abs((v-f.lo)/f.step-Math.Round((v-f.lo)/f.step))<0.0001){\n                            string get=f.real?"GetFloat":"GetInt",set=f.real?"SetFloat":"SetInt";\n                            if(ReadOptions(o,get,f.field)!=null){changed=CallOptions(o,set,f.field,f.real?(object)(float)v:(object)(int)v)!=null;var read=ReadOptions(o,get,f.field);result=changed&&read!=null&&Math.Abs(Convert.ToDouble(read)-v)<0.0001?"Setting matched locally":"Setting change not confirmed";}else result="Setting unavailable in this game build";\n                        }else result="Invalid setting";\n                    }\n                    if(changed){try{var logic=Get(Singleton("GameManager"),"LogicOptions");var dirty=logic?.GetType().GetMethod("SetDirty",F,null,Type.EmptyTypes,null);if(dirty!=null){dirty.Invoke(logic,null);result+="; sync requested";}}catch{}result+=". Verify in game; peer sync not confirmed.";}\n                }\n            }catch(Exception e){result="Could not apply: "+e.GetBaseException().GetType().Name;}\n            SimpleHostWrite("LobbyGuardian-simple-host-result.json",new{detail=result,ms=now.ToUnixTimeMilliseconds(),token=simpleHostToken});simpleHostNext=DateTimeOffset.MinValue;\n        }\n        if(now<simpleHostNext)return;simpleHostNext=now.AddSeconds(2);\n        var values=new Dictionary<string,double>();var rates=new Dictionary<string,object>();\n        if(o!=nul