llections.sort(keys);String[] rows=new String[keys.size()];for(int i=0;i<rows.length;i++){JSONObject r=rates.optJSONObject(keys.get(i));rows[i]=keys.get(i).replace("GuardianAngel","Guardian Angel").replace("Noisemaker","Noise Maker")+"  •  "+r.optInt("count")+" / "+r.optInt("chance")+"%";}\n        new AlertDialog.Builder(a).setTitle("Role adjustments").setItems(rows,(d,i)->{String role=keys.get(i);JSONObject old=rates.optJSONObject(role);LinearLayout pane=new LinearLayout(a);pane.setOrientation(LinearLayout.VERTICAL);pane.setPadding(dp(a,16),dp(a,8),dp(a,16),dp(a,8));text(a,pane,"Maximum players with this role");android.widget.Spinner count=new android.widget.Spinner(a);count.setAdapter(new android.widget.ArrayAdapter<String>(a,android.R.layout.simple_spinner_dropdown_item,new String[]{"0","1","2","3"}));count.setSelection(Math.max(0,Math.min(3,old.optInt("count"))));pane.addView(count);text(a,pane,"Spawn chance");android.widget.Spinner chance=new android.widget.Spinner(a);String[] p=new String[11];for(int j=0;j<p.length;j++)p[j]=(j*10)+"%";chance.setAdapter(new android.widget.ArrayAdapter<String>(a,android.R.layout.simple_spinner_dropdown_item,p));chance.setSelection(Math.max(0,Math.min(10,old.optInt("chance")/10)));pane.addView(chance);new AlertDialog.Builder(a).setTitle(role).setView(pane).setPositiveButton("Apply",(dd,j)->{try{simpleHostSend(a,s,new JSONObject().put("key","role").put("role",role).put("count",count.getSelectedItemPosition()).put("chance",chance.getSelectedItemPosition()*10));}catch(Exception ignored){}}).setNegativeButton("Cancel",null).show();}).setNegativeButton("Close",null).show();}\n    private static void simpleHostResult(Activity a){try{JSONObject s=simpleHostState(a);if(s==null)return;JSONObject result=new JSONObject(read(simpleHostFile(a,"result"),8192));if(!result.optString("token").equals(s.optString("token")))throw new IllegalStateException();new AlertDialog.Builder(a).setTitle("Host settings result").setMessage(result.optString("det