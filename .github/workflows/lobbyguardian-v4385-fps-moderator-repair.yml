        n+           !raw.StartsWith(\"!lg \",StringComparison.OrdinalIgnoreCase)&&!raw.StartsWith(\"/sharedclones\",StringComparison.OrdinalIgnoreCase))return\
        \ false;\\n+        if(action==\"settings\"&&!raw.StartsWith(\"/cmd lg \",StringComparison.OrdinalIgnoreCase)&&!raw.StartsWith(\"\
        !lg \",StringComparison.OrdinalIgnoreCase))return false;\\n+        forwarded=\"!lg \"+action+(parts.Length==2?\"\
        \ \"+parts[1].Trim():\"\");return true;\\n+    }\\n     internal static bool IsDelegatedText(string raw){\\n     \
        \    if(raw.StartsWith(\"/cmd lg \",StringComparison.OrdinalIgnoreCase))return true;\\n         if(raw.StartsWith(\"\
        !lg \",StringComparison.OrdinalIgnoreCase))return true;\\n@@ -136,11 +155,11 @@\\n                 return;\\n    \
        \         }\\n \\n-            string friendCode=GetPath(sender,\"Data.FriendCode\")?.ToString() ?? \"\";\\n+    \
