        \ v4.3.82, apply 30 FPS and delegated host controls')\nmarker=\"run_step('Compile final patched plugin and verify\
        \ embedded binary')\"\nassert old.count(marker)==1\nprep=old.split(marker,1)[0]+'PY\\n'\nwith tempfile.NamedTemporaryFile(mode='w',suffix='.sh',delete=False)\
