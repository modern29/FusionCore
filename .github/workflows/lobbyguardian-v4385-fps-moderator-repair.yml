        \            }\\n+        }catch{}\\n     }\\n     internal static long Begin(){\\n         long now=Stopwatch.GetTimestamp();\\\
        n@@ -83,7 +100,7 @@\\n                     string tmp=path+\".tmp\";\\n                     File.WriteAllText(tmp,JsonSerializer.Serialize(new{fps,updateHz=Math.Round(_updates/seconds,1),\\\
