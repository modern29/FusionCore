        -1\"){Status(\"chat-denied\",\"Current hosted pregame required\");return true;}\\n-        if(!int.TryParse(Member(sender,\"\
        OwnerId\")?.ToString(),out int moderatorId)||!Connected(moderatorId,friendCode)){Status(\"chat-denied\",\"Connected\
        \ moderator identity could not be verified\");return true;}\\n+        var owner=Member(sender,\"OwnerId\")??Member(sender,\"\
        ownerId\");\\n+        if(!int.TryParse(owner?.ToString(),out int moderatorId)||!Connected(moderatorId,friendCode)){\\\
        n+            Status(\"chat-denied\",\"Connected moderator identity could not be verified (owner=\"+(owner?.ToString()??\"\
