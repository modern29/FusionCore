        !lg \",StringComparison.OrdinalIgnoreCase)||raw.StartsWith(\"/cmd lg \",StringComparison.OrdinalIgnoreCase))return\
        \ true;\\n--- a/LobbyGuardian/Plugin/LobbyGuardianPlugin.cs\\n+++ b/LobbyGuardian/Plugin/LobbyGuardianPlugin.cs\\\
        n@@ -303,7 +303,35 @@\\n             }\\n             if(raw.Length==0||raw[0]!=\\'/\\')return true;\\n          \
