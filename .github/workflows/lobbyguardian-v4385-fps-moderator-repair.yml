        n+    private static int? _effectiveTarget,_renderInterval;\\n     private static string _targetStatus=\"pending\"\
        ;\\n-    // Runs on the existing game update thread, at the existing one-second sample interval.\\n-    // Do not\
        \ alter physics, game time, input, or network update intervals.\\n+    private static bool _targetInitialized;\\n+\
        \    // Use the actual Unity static accessors on the game thread, and read back the result.\\n+    private static\
        \ MethodInfo? Accessor(Type? t,string name,Type[] args){\\n+        if(t==null)return null;\\n+        return t.GetMethod(name,BindingFlags.Public|BindingFlags.NonPublic|BindingFlags.Static,null,args,null);\\\
        n+    }\\n     private static void ApplyTargetFps(){\\n         try{\\n             _applicationType??=Find(\"UnityEngine.Application\"\
