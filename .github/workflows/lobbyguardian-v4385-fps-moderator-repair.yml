        set_targetFrameRate\",new[]{typeof(int)});\\n+            _targetGet??=p?.GetGetMethod(true)??Accessor(_applicationType,\"\
        get_targetFrameRate\",Type.EmptyTypes);\\n+            if(_targetSet==null){_targetStatus=\"Unity target setter unavailable\"\
        ;_effectiveTarget=null;return;}\\n+            var before=_targetGet?.Invoke(null,null);\\n+            if(!_targetInitialized||before\
        \ is not int rate||rate!=TargetFps){\\n+                _targetSet.Invoke(null,new object[]{TargetFps});_targetInitialized=true;\\\
