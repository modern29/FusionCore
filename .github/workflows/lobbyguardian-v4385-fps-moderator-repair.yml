        /whisper \",StringComparison.OrdinalIgnoreCase)||\\n                raw.StartsWith(\"/w \",StringComparison.OrdinalIgnoreCase)){\\\
        n--- a/LobbyGuardian/Plugin/FrameHealth.cs\\n+++ b/LobbyGuardian/Plugin/FrameHealth.cs\\n@@ -45,24 +45,41 @@\\n  \
