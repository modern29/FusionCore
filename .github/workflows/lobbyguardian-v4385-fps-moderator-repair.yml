        \ not accepted\";\\n-        }catch(Exception e){_effectiveTarget=null;_targetStatus=e.GetBaseException().GetType().Name;}\\\
        n+            _effectiveTarget=_targetGet?.Invoke(null,null) is int value?value:null;\\n+            _targetStatus=_effectiveTarget==TargetFps?\"\
