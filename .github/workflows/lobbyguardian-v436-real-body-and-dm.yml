# Self-contained GitHub Actions workflow. Upload this file directly into
# .github/workflows/ in modern29/FusionCore. Replays the verified v4.2.8
# base build and local enhancements, then fixes the body and Android /dm bugs.
# No third-party proprietary code is embedded. In-game behavior remains unverified.
name: Lobby Guardian v4.3.6 - Real Body Twins + Android DM Reliability
'on':
  push:
    paths:
    - .github/workflows/lobbyguardian-v436-real-body-and-dm.yml
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
    - name: Checkout FusionCore
      uses: actions/checkout@v4
    - name: Java 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
    - name: .NET 10
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    - name: Gradle
      uses: gradle/actions/setup-gradle@v4
    - name: Install PyYAML
      run: python3 -m pip install --user PyYAML
    - name: Restore all v4.3.5 fixes + actual body sprite and reliable private chat
      shell: bash
      run: "python3 - <<'PYTHON'\nimport base64, pathlib, subprocess, urllib.request, zlib\nimport yaml\nsha='6805109d676d2c021cc30aa635b4501fc147f6d3'\nurl=('https://raw.githubusercontent.com/modern29/FusionCore/' + sha +\n    '/.github/workflows/lobbyguardian-v428-optional-alert-assertion-fix.yml')\nwith urllib.request.urlopen(url,timeout=60) as response:\n    original=yaml.safe_load(response.read().decode('utf-8'))\nsteps=original['jobs']['build']['steps']\nassert sum(s.get('name')=='Build Lobby Guardian plugin candidate' for s in steps)==1\nassert sum(s.get('name')=='Build custom Android FusionCore debug APK' for s in steps)==1\npatches=[\n    zlib.decompress(base64.b64decode('')).decode('utf-8'),\n    zlib.decompress(base64.b64decode('')).decode('utf-8')\n]\npatched=False\ncount=0\nfor step in steps:\n    label=step.get('name','')\n    if label=='Build Lobby Guardian plugin candidate':\n        for idx,patch in enumerate(patches,1):\n            patch_path=pathlib.Path('/tmp/lg_patch_'+str(idx)+'.py')\n            patch_path.write_text(patch,encoding='utf-8')\n            subprocess.run(['python3',str(patch_path)],check=True)\n        # v4.3.4: Restore a helper mistakenly removed by v4.3.2's\n        # cosmetics-only block replacement. Unmodified helper from v4.2.8.\n        visual_path=pathlib.Path('LobbyGuardian/Plugin/LobbyAppearance.cs')\n        visual_source=visual_path.read_text(encoding='utf-8')\n        marker='    // Make a real-looking LOCAL visual duplicate of the cosmetics hierarchy.'\n        if visual_source.count(marker)!=1:\n            raise RuntimeError('v4.3.4: expected visual clone insertion point missing')\n        if 'private static IEnumerable<object> ComponentsAll(' in visual_source:\n            raise RuntimeError('v4.3.4: ComponentsAll already defined; verify source baseline')\n        original_helper='    private static IEnumerable<object> ComponentsAll(object gameObject,Type t)\\n    {\\n        var results=new List<object>();\\n        foreach(var m in gameObject.GetType().GetMethods(F).Where(x=>x.Name==\"GetComponentsInChildren\")){\\n            try{\\n                MethodInfo call=m;\\n                object? result=null;\\n                if(m.IsGenericMethodDefinition&&m.GetGenericArguments().Length==1){\\n                    call=m.MakeGenericMethod(t);\\n                    if(m.GetParameters().Length==1)result=call.Invoke(gameObject,new object[]{true});\\n                    else if(m.GetParameters().Length==0)result=call.Invoke(gameObject,null);\\n                }else if(m.GetParameters().Length==2){\\n                    var a=m.GetParameters()[0].ParameterType==typeof(Type)?t:Il2CppTypeArg(m.GetParameters()[0].ParameterType,t);\\n                    if(a is not null)result=m.Invoke(gameObject,new object[]{a,true});\\n                }\\n                if(result is IEnumerable items&&result is not string){\\n                    foreach(var it in items)if(it is not null)results.Add(it);\\n                    if(results.Count>0)break;\\n                }\\n            }catch{}\\n        }\\n        return results;\\n    }\\n'\n        visual_source=visual_source.replace(marker,original_helper+'\\n'+marker,1)\n        visual_path.write_text(visual_source,encoding='utf-8')\n        assert visual_source.count('private static IEnumerable<object> ComponentsAll(')==1\n        print('v4.3.4: repaired missing ComponentsAll helper before C# compilation',flush=True)\n        # v4.3.5: add body sprites to visual twins and durable DM/role UI fixes.\n        patch435=zlib.decompress(base64.b64decode('')).decode('utf-8')\n        patch435path=pathlib.Path('/tmp/lg_patch_435.py')\n        patch435path.write_text(patch435,encoding='utf-8')\n        subprocess.run(['python3',str(patch435path)],check=True)\n        print('v4.3.5 visual twins, local DM feedback and role overlays patched',flush=True)\n        # v4.3.6 corrects two specific v4.3.5 runtime errors:\n        # missing cosmetics.currentBodySprite.BodySprite and /dm reading the\n        # empty container text before the real Android TextBoxTMP input.\n        patch436=zlib.decompress(base64.b64decode('')).decode('utf-8')\n        patch436path=pathlib.Path('/tmp/lg_patch_436.py')\n        patch436path.write_text(patch436,encoding='utf-8')\n        subprocess.run(['python3',str(patch436path)],check=True)\n        print('v4.3.6 fixed body sprite + fallback bean + private-chat Android input/roster',flush=True)\n        patched=True\n    if label=='Build custom Android FusionCore debug APK':\n        break\n    cmd=step.get('run')\n    if cmd is None:continue\n    print('::group::v4.2.8 inherited: '+label,flush=True)\n    subprocess.run(['bash','-e','-o','pipefail','-c',cmd],check=True)\n    print('::endgroup::',flush=True)\n    count+=1\nif not patched or count<35:raise RuntimeError('Original source feature steps incomplete: '+str(count))\nprint('All existing features preserved, v4.3.2 and v4.3.3 patches applied',flush=True)\nPYTHON"
    - name: Build Android APK
      run: 'chmod +x gradlew

        ./gradlew :fusionApp:assembleDebug --stacktrace'
    - name: Upload Android APK
      uses: actions/upload-artifact@v4
      with:
        name: LobbyGuardian-v4.3.6-Android-BodyTwins-DM
        path: fusionApp/build/outputs/apk/debug/*.apk
        if-no-files-found: error
    - name: Upload plugin source and diagnostics
      uses: actions/upload-artifact@v4
      with:
        name: LobbyGuardian-v4.3.6-Sources-Diagnostics
        path: 'LobbyGuardian/Plugin/*.cs

          LobbyGuardian/bin/Release/net10.0/LobbyGuardian.Plugin.dll'
        if-no-files-found: error
